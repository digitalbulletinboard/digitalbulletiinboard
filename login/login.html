<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bulletin Board</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #eef2ff;
      --card:      #ffffff;
      --primary:   #5b7fff;
      --pl:        #dce5ff;
      --pd:        #3a5ce4;
      --text:      #1e2a4a;
      --muted:     #7a87a8;
      --border:    #e2e8f8;
      --ok:        #22c55e;
      --err:       #ef4444;
      --warn:      #f59e0b;
      --r:         14px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(91,127,255,.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(147,112,219,.08) 0%, transparent 45%);
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      padding: 40px 36px 36px;
      box-shadow: 0 12px 48px rgba(91,127,255,.14);
      border: 1px solid var(--border);
      animation: up .45s ease;
    }
    @keyframes up { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }
    .logo-wrap { text-align: center; margin-bottom: 26px; }
    .logo-icon {
      font-size: 32px;
      background: var(--pl);
      width: 64px; height: 64px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 18px; margin-bottom: 12px;
    }
    .logo-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text); }
    .logo-sub   { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .tabs { display: flex; background: var(--bg); border-radius: 10px; padding: 4px; gap: 4px; margin-bottom: 22px; }
    .tab {
      flex:1; padding: 9px; border: none; background: transparent;
      font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500;
      color: var(--muted); cursor:pointer; border-radius:8px; transition:.18s;
    }
    .tab.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(91,127,255,.15); }
    .form { display: none; }
    .form.on { display: block; }
    .field { margin-bottom: 15px; }
    .field label { display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:5px; }
    .field input, .field textarea, .field select {
      width:100%; padding:11px 13px;
      border:1.5px solid var(--border); border-radius:var(--r);
      font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text);
      background:#fafbff; outline:none; transition:.18s;
    }
    .field textarea { min-height:76px; resize:vertical; }
    .field input:focus, .field textarea:focus {
      border-color:var(--primary); box-shadow:0 0 0 3px rgba(91,127,255,.11); background:#fff;
    }
    .msg { min-height:20px; font-size:13px; text-align:center; margin-bottom:6px; border-radius:8px; padding:4px 0; }
    .msg.ok   { color:var(--ok); }
    .msg.err  { color:var(--err); }
    .msg.warn { color:var(--warn); }
    .btn {
      width:100%; padding:13px; background:var(--primary); color:#fff;
      border:none; border-radius:var(--r); font-family:'DM Sans',sans-serif;
      font-size:15px; font-weight:600; cursor:pointer; transition:.18s; margin-top:4px;
    }
    .btn:hover { background:var(--pd); }
    .btn:active { transform:scale(.98); }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">📋</div>
    <div class="logo-title">Bulletin Board</div>
    <div class="logo-sub">Digital Slideshow Admin</div>
  </div>

  <div class="tabs">
    <button class="tab on" id="t-login"    onclick="sw('login')">Sign In</button>
    <button class="tab"    id="t-register" onclick="sw('register')">Request Access</button>
  </div>

  <!-- LOGIN -->
  <div class="form on" id="f-login">
    <div class="field"><label>Email</label><input type="email"    id="l-email" placeholder="admin@example.com"></div>
    <div class="field"><label>Password</label><input type="password" id="l-pass"  placeholder="••••••••"></div>
    <div class="msg" id="l-msg"></div>
    <button class="btn" onclick="doLogin()">Sign In</button>
  </div>

  <!-- REGISTER -->
  <div class="form" id="f-register">
    <div class="field"><label>Full Name</label><input type="text"     id="r-name"   placeholder="Your full name"></div>
    <div class="field"><label>Email</label>    <input type="email"    id="r-email"  placeholder="you@example.com"></div>
    <div class="field"><label>Password</label> <input type="password" id="r-pass"   placeholder="Min. 6 characters"></div>
    <div class="field"><label>Why do you need access?</label><textarea id="r-reason" placeholder="Brief reason..."></textarea></div>
    <div class="msg" id="r-msg"></div>
    <button class="btn" onclick="doRegister()">Submit Request</button>
  </div>
</div>

<script type="module">
// ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────────
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, get, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL:       "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
// ─────────────────────────────────────────────────────────────────────────────

window.sw = function(tab) {
  ['login','register'].forEach(t => {
    document.getElementById('f-'+t).classList.toggle('on', t===tab);
    document.getElementById('t-'+t).classList.toggle('on', t===tab);
  });
};

window.doLogin = async function() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const msg   = document.getElementById('l-msg');
  msg.className='msg'; msg.textContent='';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const uid  = cred.user.uid;
    const snap = await get(ref(db, 'users/'+uid));
    if (!snap.exists()) {
      await signOut(auth);
      msg.className='msg err'; msg.textContent='User record not found. Contact admin.'; return;
    }
    const status = snap.val().status;
    if (status === 'pending')  { await signOut(auth); msg.className='msg warn'; msg.textContent='⏳ Access pending admin approval.'; return; }
    if (status === 'rejected') { await signOut(auth); msg.className='msg err';  msg.textContent='❌ Access was rejected. Contact admin.'; return; }
    if (status === 'approved') { window.location.href = 'admin.html'; return; }
  } catch(e) {
    msg.className='msg err'; msg.textContent = fmtErr(e.code);
  }
};

window.doRegister = async function() {
  const name   = document.getElementById('r-name').value.trim();
  const email  = document.getElementById('r-email').value.trim();
  const pass   = document.getElementById('r-pass').value;
  const reason = document.getElementById('r-reason').value.trim();
  const msg    = document.getElementById('r-msg');
  msg.className='msg'; msg.textContent='';
  if (!name||!email||!pass||!reason) { msg.className='msg err'; msg.textContent='Fill in all fields.'; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid  = cred.user.uid;
    const data = { name, email, reason, status:'pending', requestedAt: Date.now() };
    await set(ref(db,'users/'+uid), data);
    await set(ref(db,'notifications/'+uid), { ...data, type:'access_request', notifStatus:'unread' });
    await signOut(auth);
    msg.className='msg ok'; msg.textContent='✅ Request submitted! Wait for admin approval.';
    document.getElementById('r-name').value=document.getElementById('r-email').value=document.getElementById('r-pass').value=document.getElementById('r-reason').value='';
  } catch(e) {
    msg.className='msg err'; msg.textContent = fmtErr(e.code);
  }
};

function fmtErr(code) {
  return ({
    'auth/email-already-in-use':'Email already registered.',
    'auth/invalid-email':'Invalid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/user-not-found':'No account with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts. Try again later.',
  })[code] || 'Something went wrong. Try again.';
}
</script>
</body>
</html>
