<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --bar: 90px; --blue: #2563eb; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111827;
      font-family: 'Sora', sans-serif;
    }

    /* ─── SLIDESHOW WRAPPER ─────────────────────────────────────
       position:fixed so overflow:hidden does NOT block pointer events
       on child arrows. Arrows sit outside the clip path of slides.   */
    #sw {
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: var(--bar);
      height: calc(100vh - var(--bar));  /* explicit height so arrow top:50% works */
      z-index: 10;                        /* above pbar(50)? No — arrows need z above bar */
    }

    /* ─── SLIDES (clipped container separate from arrows) ─── */
    #slides-clip {
      position: absolute;
      inset: 0;
      overflow: hidden;          /* only clips the slides, NOT the arrows */
      background: #f0f6ff;
    }

    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.85s ease;
      z-index: 1;
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }

    /* TEXT SLIDES */
    .bg-blue   { background: linear-gradient(135deg,#e8f4fd,#dbeafe 60%,#eff6ff); }
    .bg-purple { background: linear-gradient(135deg,#f5f3ff,#ede9fe 60%,#faf5ff); }
    .bg-green  { background: linear-gradient(135deg,#f0fdf4,#dcfce7 60%,#ecfdf5); }
    .bg-amber  { background: linear-gradient(135deg,#fffbeb,#fef3c7 60%,#fef9c3); }
    .bg-rose   { background: linear-gradient(135deg,#fff1f2,#ffe4e6 60%,#fdf2f8); }
    .bg-teal   { background: linear-gradient(135deg,#f0fdfa,#ccfbf1 60%,#ecfdf5); }

    .slide-card {
      width: 80%; max-width: 1100px;
      text-align: center;
      padding: 64px 80px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(28px);
      border-radius: 32px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.9), 0 28px 80px rgba(0,0,0,0.09);
    }
    .s-cat {
      display: inline-block;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 6px 20px; border-radius: 99px;
      margin-bottom: 22px;
    }
    .bg-blue   .s-cat { background:#dbeafe; color:#2563eb; }
    .bg-purple .s-cat { background:#ede9fe; color:#7c3aed; }
    .bg-green  .s-cat { background:#dcfce7; color:#16a34a; }
    .bg-amber  .s-cat { background:#fef3c7; color:#d97706; }
    .bg-rose   .s-cat { background:#ffe4e6; color:#e11d48; }
    .bg-teal   .s-cat { background:#ccfbf1; color:#0d9488; }
    .s-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(32px,5.5vw,76px);
      color: #0f1b2d; line-height: 1.15;
      margin-bottom: 20px; font-weight: 700;
    }
    .s-body {
      font-size: clamp(16px,2.2vw,32px);
      color: #3a4e6a; line-height: 1.7; font-weight: 300;
    }

    /* IMAGE SLIDE */
    .img-wrap { position: absolute; inset: 0; overflow: hidden; }
    .img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .img-cap {
      position: absolute; bottom:0; left:0; right:0;
      padding: 24px 48px 32px;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      color: white; text-align: left;
    }
    .cap-tag { font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; opacity:0.8; margin-bottom:5px; }
    .cap-title { font-family:'Fraunces',serif; font-size:clamp(20px,3.5vw,48px); font-weight:700; line-height:1.2; }

    /* VIDEO SLIDE */
    .vid-wrap { position:absolute; inset:0; }
    .vid-wrap video { width:100%; height:100%; object-fit:cover; background:#000; display:block; }

    /* ─── ARROWS — outside slides-clip so overflow:hidden doesn't block them ─── */
    .arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      z-index: 200;                        /* above bar(60), pbar(50), slides(2) */
      width: 54px; height: 54px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255,255,255,0.38);
      border-radius: 50%;
      color: #fff; font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.22);
      pointer-events: auto;
      user-select: none;
    }
    .arrow:hover  { background: rgba(37,99,235,0.65); }
    .arrow:active { transform: translateY(-50%) scale(0.93); }
    #ap { left: 18px; }
    #an { right: 18px; }

    /* ─── DOTS ─── */
    #dots {
      position: absolute;
      bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 150;
      display: flex; gap: 7px;
      pointer-events: none;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 99px;
      background: rgba(255,255,255,0.42);
      border: 1.5px solid rgba(255,255,255,0.6);
      transition: all 0.3s; cursor: pointer;
      pointer-events: auto;
    }
    .dot.on { background: white; width: 24px; }

    /* ─── PROGRESS BAR ─── */
    #pbar {
      position: fixed;
      bottom: var(--bar); left: 0;
      height: 3px;
      background: linear-gradient(90deg,#2563eb,#60a5fa);
      width: 0%; z-index: 50;
      border-radius: 0 2px 0 0;
      pointer-events: none;
    }

    /* ─── INFO BAR ─── */
    #bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--bar);
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px);
      border-top: 1.5px solid rgba(37,99,235,0.10);
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      padding: 0 28px; gap: 16px;
      box-shadow: 0 -4px 24px rgba(37,99,235,0.06);
      transition: background 0.55s, border-color 0.55s, backdrop-filter 0.55s;
      z-index: 60;
    }
    #bar.media {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-top-color: transparent;
      box-shadow: none;
    }
    /* text colours swap on media */
    #bar .day, #bar .clock, #bar .wtemp { color: #0f1b2d; transition: color 0.4s; }
    #bar .sub, #bar .dname, #bar .dnum, #bar .ampm, #bar .sec,
    #bar .wdesc, #bar .wcity, #bar .wextra { color: #8fa3b8; transition: color 0.4s; }
    #bar.media .day, #bar.media .clock, #bar.media .wtemp { color: #fff; }
    #bar.media .sub, #bar.media .dname, #bar.media .dnum, #bar.media .ampm,
    #bar.media .sec, #bar.media .wdesc, #bar.media .wcity,
    #bar.media .wextra { color: rgba(255,255,255,0.78); }
    #bar.media .dnum.today { background: rgba(255,255,255,0.22) !important; color:#fff; }

    /* left */
    .bleft { display:flex; align-items:center; gap:18px; }
    .dblock { line-height:1.3; }
    .day { font-family:'Fraunces',serif; font-size:24px; font-weight:700; }
    .sub { font-size:12px; font-weight:500; }
    .mcal { display:flex; gap:5px; }
    .dcol { display:flex; flex-direction:column; align-items:center; gap:3px; }
    .dname { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
    .dnum { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:12px; font-weight:600; }
    .dnum.today { background:var(--blue); color:white; }
    /* center */
    .bcenter { text-align:center; }
    .clock { font-family:'Fraunces',serif; font-size:36px; font-weight:700; line-height:1; }
    .sec { font-size:20px; font-weight:400; }
    .ampm { font-size:13px; font-weight:500; letter-spacing:0.06em; margin-top:2px; }
    /* right */
    .bright { display:flex; align-items:center; justify-content:flex-end; gap:14px; }
    .wmain { display:flex; align-items:center; gap:10px; }
    .wicon { font-size:38px; line-height:1; }
    .wtemp { font-family:'Fraunces',serif; font-size:30px; font-weight:700; line-height:1; }
    .winfo { line-height:1.4; }
    .wdesc { font-size:13px; font-weight:500; text-transform:capitalize; }
    .wcity { font-size:11px; }
    .wexs  { display:flex; flex-direction:column; gap:3px; }
    .wextra{ font-size:11px; display:flex; align-items:center; gap:4px; }
    /* admin btn */
    #abtn {
      display:flex; align-items:center; gap:7px;
      padding:9px 16px;
      background:rgba(37,99,235,0.10);
      color:#2563eb;
      border:1.5px solid rgba(37,99,235,0.22);
      border-radius:10px;
      font-family:'Sora',sans-serif;
      font-size:12px; font-weight:600;
      cursor:pointer; text-decoration:none;
      white-space:nowrap;
      transition:background 0.2s,border-color 0.2s,color 0.2s;
    }
    #abtn:hover { background:rgba(37,99,235,0.18); border-color:rgba(37,99,235,0.45); }
    #bar.media #abtn { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.30); color:white; }
    #bar.media #abtn:hover { background:rgba(255,255,255,0.22); }

    /* loading */
    #ls {
      position:fixed; inset:0; z-index:999;
      background:#f0f6ff;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:14px;
      transition:opacity 0.5s;
    }
    #ls .icon { font-size:52px; animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    #ls p { font-size:14px; color:#8fa3b8; font-weight:500; }
    #ls.gone { opacity:0; pointer-events:none; }
    .nomsg {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-family:'Fraunces',serif; font-size:32px;
      color:#8fa3b8; text-align:center; padding:40px; z-index:5;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="ls"><div class="icon">📋</div><p>Loading…</p></div>

<!-- Slideshow wrapper: fixed, no overflow:hidden here -->
<div id="sw">
  <!-- Slides live in their own clipped container -->
  <div id="slides-clip"></div>

  <!-- Arrows outside the clip — pointer events always work -->
  <button class="arrow" id="ap" title="Previous">&#8592;</button>
  <button class="arrow" id="an" title="Next">&#8594;</button>

  <!-- Dots -->
  <div id="dots"></div>
</div>

<!-- Progress bar -->
<div id="pbar"></div>

<!-- Info bar -->
<div id="bar">
  <div class="bleft">
    <div class="dblock">
      <div class="day" id="cday">Thursday</div>
      <div class="sub" id="cdate">April 23, 2026</div>
    </div>
    <div class="mcal" id="mcal"></div>
  </div>

  <div class="bcenter">
    <div class="clock">
      <span id="ch">12</span>:<span id="cm">00</span><span class="sec">:<span id="cs">00</span></span>
    </div>
    <div class="ampm" id="camp">AM</div>
  </div>

  <div class="bright">
    <div class="wmain">
      <div class="wicon" id="wxi">⛅</div>
      <div class="winfo">
        <div class="wtemp" id="wxt">--°</div>
        <div class="wdesc" id="wxd">Loading…</div>
        <div class="wcity" id="wxc"></div>
      </div>
    </div>
    <div class="wexs">
      <div class="wextra" id="wxh">💧 --%</div>
      <div class="wextra" id="wxw">💨 -- km/h</div>
    </div>
  </div>

  <a href="admin.html" id="abtn">⚙️ Admin</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ── CONFIG ── change these two values ────────────────────────────────────── */
const OWM_KEY  = "f5168c305674a67a705409181a80046d";  // free at openweathermap.org
const OWM_CITY = "Cebu City";
const OWM_UNIT = "metric";   // metric=°C  imperial=°F

const FB = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  storageBucket:     "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};
/* ─────────────────────────────────────────────────────────────────────────── */

const db  = getDatabase(initializeApp(FB));

/* ── DOM refs ───────────────────────────────────────────────────────────── */
const clip  = document.getElementById('slides-clip');
const dotsW = document.getElementById('dots');
const pbar  = document.getElementById('pbar');
const bar   = document.getElementById('bar');
const btnP  = document.getElementById('ap');
const btnN  = document.getElementById('an');

/* ── State ──────────────────────────────────────────────────────────────── */
let posts      = [];
let idx        = 0;     // current slide index
let tmr        = null;
let loaded     = false; // true after first Firebase response

/* ── Firebase ───────────────────────────────────────────────────────────── */
onValue(ref(db, 'posts'), snap => {
  /* Save key of slide showing BEFORE overwriting posts array */
  const prevKey = posts[idx]?._key ?? null;

  posts = [];
  if (snap.exists()) snap.forEach(c => posts.push({ _key: c.key, ...c.val() }));

  rebuild();

  if (!loaded) {
    loaded = true;
    idx = 0;
    go(0);
    /* fade out loader */
    const ls = document.getElementById('ls');
    if (ls) { ls.classList.add('gone'); setTimeout(() => ls.remove(), 600); }
  } else {
    /* live update — stay on same slide key */
    const ni = posts.findIndex(p => p._key === prevKey);
    idx = ni >= 0 ? ni : 0;
    go(idx); /* restart timer from current slide after rebuild */
  }
});

/* ── Rebuild slide DOM ──────────────────────────────────────────────────── */
function rebuild() {
  clip.querySelectorAll('.slide,.nomsg').forEach(e => e.remove());
  dotsW.innerHTML = '';

  if (!posts.length) {
    btnP.style.visibility = 'hidden';
    btnN.style.visibility = 'hidden';
    const m = document.createElement('div');
    m.className = 'nomsg';
    m.innerHTML = '📭<br>No slides yet.<br><small style="font-family:Sora,sans-serif;font-size:16px">Add slides from admin panel.</small>';
    clip.appendChild(m);
    kill();
    return;
  }

  btnP.style.visibility = '';
  btnN.style.visibility = '';

  posts.forEach((p, i) => {
    clip.appendChild(mkSlide(p, i));
    const d = document.createElement('span');
    d.className = 'dot';
    d.dataset.i = i;
    dotsW.appendChild(d);
  });
}

function mkSlide(p, i) {
  const s = document.createElement('div');
  s.className = 'slide';
  s.dataset.i = i;

  if (p.type === 'text') {
    s.classList.add('bg-' + (p.bgtheme || 'blue'));
    const card = mk('div','slide-card');
    card.append(
      txt('div','s-cat',   p.category || 'Announcement'),
      txt('div','s-title', p.title    || ''),
      txt('div','s-body',  p.content  || '')
    );
    s.appendChild(card);

  } else if (p.type === 'image') {
    const w = mk('div','img-wrap');
    const img = document.createElement('img');
    img.src = p.mediaUrl || ''; img.alt = p.title || '';
    const cap = mk('div','img-cap');
    cap.append(txt('div','cap-tag',   p.category || 'Photo'),
               txt('div','cap-title', p.title    || ''));
    w.append(img, cap);
    s.appendChild(w);

  } else if (p.type === 'video') {
    const w = mk('div','vid-wrap');
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    const src = document.createElement('source');
    src.src = p.mediaUrl || ''; src.type = 'video/mp4';
    v.appendChild(src); w.appendChild(v); s.appendChild(w);
  }

  return s;
}

/* helpers */
function mk(tag, cls) { const e = document.createElement(tag); e.className = cls; return e; }
function txt(tag, cls, t) { const e = mk(tag,cls); e.textContent = t; return e; }

/* ── Show a slide ───────────────────────────────────────────────────────── */
function go(i) {
  const slides = clip.querySelectorAll('.slide');
  const ddots  = dotsW.querySelectorAll('.dot');
  if (!slides.length) return;

  kill(); /* always clear timer before doing anything */

  /* clamp */
  i = ((i % slides.length) + slides.length) % slides.length;
  idx = i;

  /* deactivate all + stop every video */
  slides.forEach((s, si) => {
    s.classList.remove('active');
    ddots[si]?.classList.remove('on');
    const v = s.querySelector('video');
    if (v) {
      v.pause();
      v.currentTime = 0;
      v.onended = null;
      /* remove any pending loadedmetadata listeners by cloning */
    }
  });

  /* activate target */
  const slide = slides[i];
  slide.classList.add('active');
  ddots[i]?.classList.add('on');

  /* info bar style */
  const type = posts[i]?.type;
  bar.classList.toggle('media', type === 'image' || type === 'video');

  /* progress bar reset */
  pbar.style.transition = 'none';
  pbar.style.width = '0%';

  /* video slide */
  const vid = slide.querySelector('video');
  if (vid) {
    /* Reset progress bar */
    pbar.style.transition = 'none';
    pbar.style.width = '0%';
    vid.onended = () => go(idx + 1);

    const startVideo = () => {
      vid.play().catch(() => {});
      const dur = (isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 10;
      bar2(dur * 1000);
      /* fallback timer in case video never fires ended */
      tmr = setTimeout(() => go(idx + 1), dur * 1000 + 500);
    };

    if (vid.readyState >= 1) {
      startVideo();
    } else {
      vid.addEventListener('loadedmetadata', startVideo, { once: true });
      /* if metadata never loads within 3s, advance anyway */
      tmr = setTimeout(() => { vid.removeEventListener('loadedmetadata', startVideo); go(idx + 1); }, 10000);
    }
    return;
  }

  /* text / image slide */
  const ms = Number(posts[i]?.duration) || 7000;
  bar2(ms);
  tmr = setTimeout(() => go(idx + 1), ms);
}

function bar2(ms) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    pbar.style.transition = `width ${ms}ms linear`;
    pbar.style.width = '100%';
  }));
}

function kill() {
  if (tmr) { clearTimeout(tmr); tmr = null; }
}

/* ── Arrow buttons ──────────────────────────────────────────────────────── */
btnP.addEventListener('click', e => { e.stopPropagation(); go(idx - 1); });
btnN.addEventListener('click', e => { e.stopPropagation(); go(idx + 1); });

/* ── Dot clicks ─────────────────────────────────────────────────────────── */
dotsW.addEventListener('click', e => {
  const i = parseInt(e.target.dataset.i);
  if (!isNaN(i)) go(i);
});

/* ── Keyboard ───────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  go(idx - 1);
  if (e.key === 'ArrowRight') go(idx + 1);
  if (e.key === ' ') { e.preventDefault(); go(idx + 1); }
});

/* ── Click anywhere on slide area to advance ────────────────────────────── */
document.getElementById('slides-clip').addEventListener('click', e => {
  go(idx + 1);
});

/* ── Clock ──────────────────────────────────────────────────────────────── */
function tick() {
  const n = new Date();
  let h = n.getHours();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('ch').textContent   = String(h).padStart(2,'0');
  document.getElementById('cm').textContent   = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('cs').textContent   = String(n.getSeconds()).padStart(2,'0');
  document.getElementById('camp').textContent = ap;
  const D = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cday').textContent  = D[n.getDay()];
  document.getElementById('cdate').textContent = `${M[n.getMonth()]} ${n.getDate()}, ${n.getFullYear()}`;
}

/* ── Mini calendar ──────────────────────────────────────────────────────── */
function buildCal() {
  const now = new Date(), t = now.getDate();
  const DN = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const cal = document.getElementById('mcal');
  cal.innerHTML = '';
  for (let off = -2; off <= 4; off++) {
    const d = new Date(now); d.setDate(t + off);
    const col = document.createElement('div');
    col.className = 'dcol';
    const dn = document.createElement('div'); dn.className='dname'; dn.textContent=DN[d.getDay()];
    const dd = document.createElement('div'); dd.className='dnum'+(off===0?' today':''); dd.textContent=d.getDate();
    col.append(dn, dd);
    cal.appendChild(col);
  }
}

/* ── Weather ────────────────────────────────────────────────────────────── */
const WXMAP = {
  '01d':'☀️','01n':'🌙','02d':'⛅','02n':'☁️','03d':'☁️','03n':'☁️',
  '04d':'☁️','04n':'☁️','09d':'🌧️','09n':'🌧️','10d':'🌦️','10n':'🌧️',
  '11d':'⛈️','11n':'⛈️','13d':'❄️','13n':'❄️','50d':'🌫️','50n':'🌫️'
};
async function wxFetch() {
  try {
    const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(OWM_CITY)}&appid=${OWM_KEY}&units=${OWM_UNIT}`);
    const j = await r.json();
    if (j.cod !== 200) throw new Error(j.message);
    document.getElementById('wxi').textContent = WXMAP[j.weather[0].icon] || '🌡️';
    document.getElementById('wxt').textContent = `${Math.round(j.main.temp)}°`;
    document.getElementById('wxd').textContent = j.weather[0].description;
    document.getElementById('wxc').textContent = `${j.name}, ${j.sys.country}`;
    document.getElementById('wxh').textContent = `💧 ${j.main.humidity}%`;
    document.getElementById('wxw').textContent = `💨 ${Math.round(j.wind.speed*3.6)} km/h`;
  } catch(e) {
    document.getElementById('wxd').textContent = 'Weather unavailable';
    document.getElementById('wxc').textContent = 'Set OWM_KEY & OWM_CITY';
  }
}

/* ── Init ───────────────────────────────────────────────────────────────── */
setInterval(tick, 1000); tick();
buildCal();
wxFetch();
setInterval(wxFetch, 10*60*1000);
</script>
