<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --info-h: 90px;
      --blue: #2563eb;
      --arrow-size: 52px;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0f1e;
      font-family: 'Sora', sans-serif;
    }

    /* ── SLIDESHOW AREA ── */
    #slideshow-area {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: var(--info-h);
      overflow: hidden;
      background: #f0f6ff;
    }

    /* ── SLIDES ── */
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.75s ease, visibility 0.75s ease;
      z-index: 1;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    /* ── TEXT SLIDE BACKGROUNDS ── */
    .slide-bg-blue   { background: linear-gradient(135deg, #e8f4fd 0%, #dbeafe 60%, #eff6ff 100%); }
    .slide-bg-purple { background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 60%, #faf5ff 100%); }
    .slide-bg-green  { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 60%, #ecfdf5 100%); }
    .slide-bg-amber  { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 60%, #fef9c3 100%); }
    .slide-bg-rose   { background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 60%, #fdf2f8 100%); }
    .slide-bg-teal   { background: linear-gradient(135deg, #f0fdfa 0%, #ccfbf1 60%, #ecfdf5 100%); }

    /* ── TEXT SLIDE CARD ── */
    .slide-inner {
      width: 80%; max-width: 1100px;
      text-align: center;
      padding: 64px 80px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(28px);
      border-radius: 32px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.9), 0 28px 80px rgba(0,0,0,0.09);
      animation: cardIn 0.65s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .slide-category {
      display: inline-block;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 6px 20px; border-radius: 99px;
      margin-bottom: 22px;
    }

    .slide-bg-blue   .slide-category { background: #dbeafe; color: #2563eb; }
    .slide-bg-purple .slide-category { background: #ede9fe; color: #7c3aed; }
    .slide-bg-green  .slide-category { background: #dcfce7; color: #16a34a; }
    .slide-bg-amber  .slide-category { background: #fef3c7; color: #d97706; }
    .slide-bg-rose   .slide-category { background: #ffe4e6; color: #e11d48; }
    .slide-bg-teal   .slide-category { background: #ccfbf1; color: #0d9488; }

    .slide-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(34px, 5.5vw, 76px);
      color: #0f1b2d; line-height: 1.15;
      margin-bottom: 22px; font-weight: 700;
    }

    .slide-content {
      font-size: clamp(17px, 2.2vw, 32px);
      color: #3a4e6a; line-height: 1.7; font-weight: 300;
    }

    /* ── IMAGE SLIDE ── */
    .slide-image-wrap {
      position: absolute; inset: 0; overflow: hidden;
    }

    .slide-image-wrap img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .slide-image-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 48px 32px;
      background: linear-gradient(transparent, rgba(0,0,0,0.60));
      color: white; text-align: left;
    }

    .cap-tag {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; opacity: 0.8; margin-bottom: 6px;
    }

    .cap-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(22px, 3.5vw, 50px);
      font-weight: 700; line-height: 1.2;
    }

    /* ── VIDEO SLIDE ── */
    .slide-video-wrap {
      position: absolute; inset: 0;
    }

    .slide-video-wrap video {
      width: 100%; height: 100%;
      object-fit: cover; background: #000;
      display: block;
    }

    /* ── ARROW NAVIGATION ── */
    .arrow-btn {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      z-index: 20;
      width: var(--arrow-size); height: var(--arrow-size);
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,255,255,0.40);
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      /* Prevent arrow clicks from bubbling to the document click handler */
      pointer-events: all;
    }

    .arrow-btn:hover {
      background: rgba(37,99,235,0.55);
      transform: translateY(-50%) scale(1.08);
    }

    .arrow-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    #arrow-prev { left: 20px; }
    #arrow-next { right: 20px; }

    /* ── SLIDE DOTS ── */
    #slide-dots {
      position: absolute;
      bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      display: flex; gap: 7px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.45);
      border: 1.5px solid rgba(255,255,255,0.6);
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot.active {
      background: white;
      width: 24px;
    }

    /* ── PROGRESS BAR ── */
    #progress-bar {
      position: absolute;
      bottom: var(--info-h); left: 0;
      height: 3px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      width: 0%;
      z-index: 30;
      border-radius: 0 2px 0 0;
    }

    /* ── INFO BAR ── */
    #info-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: var(--info-h);
      /* Transparent when media (image/video) is showing — JS toggles this */
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px);
      border-top: 1.5px solid rgba(37,99,235,0.10);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 32px;
      gap: 16px;
      box-shadow: 0 -4px 24px rgba(37,99,235,0.06);
      transition: background 0.6s ease, border-color 0.6s ease;
      z-index: 10;
    }

    /* Transparent variant for image/video slides */
    #info-bar.on-media {
      background: rgba(0,0,0,0.35);
      border-top-color: rgba(255,255,255,0.12);
      box-shadow: none;
    }

    #info-bar.on-media .info-day,
    #info-bar.on-media .info-time,
    #info-bar.on-media .weather-temp { color: #fff; }

    #info-bar.on-media .info-date-label,
    #info-bar.on-media .cal-day-name,
    #info-bar.on-media .cal-day-num,
    #info-bar.on-media .info-ampm,
    #info-bar.on-media .info-seconds,
    #info-bar.on-media .weather-desc,
    #info-bar.on-media .weather-city,
    #info-bar.on-media .weather-extra-item { color: rgba(255,255,255,0.75); }

    #info-bar.on-media .cal-day-num.today { background: rgba(255,255,255,0.25); color: #fff; }

    /* LEFT */
    .info-left { display: flex; align-items: center; gap: 18px; }

    .info-date-block { line-height: 1.3; }

    .info-day {
      font-family: 'Fraunces', serif;
      font-size: 24px; font-weight: 700; color: #0f1b2d;
    }

    .info-date-label { font-size: 12px; color: #8fa3b8; font-weight: 500; }

    .mini-cal { display: flex; gap: 5px; }

    .cal-day-col {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
    }

    .cal-day-name {
      font-size: 9px; font-weight: 700;
      color: #8fa3b8; text-transform: uppercase; letter-spacing: 0.06em;
    }

    .cal-day-num {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; font-size: 12px; font-weight: 600; color: #4a5d78;
    }

    .cal-day-num.today { background: var(--blue); color: white; }

    /* CENTER */
    .info-center { text-align: center; }

    .info-time {
      font-family: 'Fraunces', serif;
      font-size: 36px; font-weight: 700; color: #0f1b2d;
      line-height: 1; letter-spacing: -0.01em;
    }

    .info-seconds { font-size: 20px; color: #8fa3b8; font-weight: 400; }

    .info-ampm {
      font-size: 13px; color: #8fa3b8; font-weight: 500;
      letter-spacing: 0.06em; margin-top: 2px;
    }

    /* RIGHT */
    .info-right {
      display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    }

    .weather-main { display: flex; align-items: center; gap: 10px; }

    .weather-icon { font-size: 38px; line-height: 1; }

    .weather-temp {
      font-family: 'Fraunces', serif;
      font-size: 30px; font-weight: 700; color: #0f1b2d; line-height: 1;
    }

    .weather-info { line-height: 1.4; }

    .weather-desc { font-size: 13px; color: #4a5d78; font-weight: 500; text-transform: capitalize; }

    .weather-city { font-size: 11px; color: #8fa3b8; }

    .weather-extras { display: flex; flex-direction: column; gap: 3px; }

    .weather-extra-item { font-size: 11px; color: #8fa3b8; display: flex; align-items: center; gap: 4px; }

    /* ── LOADING SCREEN ── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 999;
      background: #f0f6ff;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      transition: opacity 0.5s ease;
    }

    #loading-screen .load-icon { font-size: 52px; animation: pulse 1.4s ease-in-out infinite; }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    #loading-screen p { font-size: 14px; color: #8fa3b8; font-weight: 500; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="load-icon">📋</div>
  <p>Loading Bulletin Board…</p>
</div>

<!-- SLIDESHOW AREA -->
<div id="slideshow-area">
  <!-- Arrow buttons -->
  <button class="arrow-btn" id="arrow-prev" title="Previous">&#8592;</button>
  <button class="arrow-btn" id="arrow-next" title="Next">&#8594;</button>
  <!-- Dot indicators -->
  <div id="slide-dots"></div>
</div>

<!-- PROGRESS BAR -->
<div id="progress-bar"></div>

<!-- INFO BAR -->
<div id="info-bar">
  <div class="info-left">
    <div class="info-date-block">
      <div class="info-day" id="clock-day">Monday</div>
      <div class="info-date-label" id="clock-date">January 1, 2025</div>
    </div>
    <div class="mini-cal" id="mini-cal"></div>
  </div>

  <div class="info-center">
    <div class="info-time">
      <span id="clock-h">12</span>:<span id="clock-m">00</span><span class="info-seconds">:<span id="clock-s">00</span></span>
    </div>
    <div class="info-ampm" id="clock-ampm">AM</div>
  </div>

  <div class="info-right">
    <div class="weather-main">
      <div class="weather-icon" id="wx-icon">⛅</div>
      <div class="weather-info">
        <div class="weather-temp" id="wx-temp">--°</div>
        <div class="weather-desc" id="wx-desc">Loading…</div>
        <div class="weather-city" id="wx-city"></div>
      </div>
    </div>
    <div class="weather-extras">
      <div class="weather-extra-item" id="wx-humidity">💧 --%</div>
      <div class="weather-extra-item" id="wx-wind">💨 -- km/h</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── CONFIG ────────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  storageBucket:     "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};

// ── OPENWEATHERMAP ─────────────────────────────────────────────────────────────
// Get a free key at https://openweathermap.org/api → Current Weather → Free plan
const OWM_API_KEY = "f5168c305674a67a705409181a80046d";  // ← REPLACE with your key
const OWM_CITY    = "Cebu City";   // ← Set your city
const OWM_UNITS   = "metric";      // "metric" = °C | "imperial" = °F

// ── FIREBASE ──────────────────────────────────────────────────────────────────
const app      = initializeApp(firebaseConfig);
const db       = getDatabase(app);
const postsRef = ref(db, "posts");

// ── STATE ─────────────────────────────────────────────────────────────────────
let data         = [];
let slides       = [];
let currentIndex = 0;
let timer        = null;
const progressBar = document.getElementById('progress-bar');
const infoBar     = document.getElementById('info-bar');
const area        = document.getElementById('slideshow-area');
const dotsEl      = document.getElementById('slide-dots');

// ── CLOCK ─────────────────────────────────────────────────────────────────────
function updateClock() {
  const now  = new Date();
  let h      = now.getHours();
  const m    = now.getMinutes();
  const s    = now.getSeconds();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock-h').textContent    = String(h).padStart(2,'0');
  document.getElementById('clock-m').textContent    = String(m).padStart(2,'0');
  document.getElementById('clock-s').textContent    = String(s).padStart(2,'0');
  document.getElementById('clock-ampm').textContent = ampm;

  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  document.getElementById('clock-day').textContent  = DAYS[now.getDay()];
  document.getElementById('clock-date').textContent = `${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}

// ── MINI CALENDAR ─────────────────────────────────────────────────────────────
function buildMiniCal() {
  const now     = new Date();
  const today   = now.getDate();
  const DNAMES  = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  dotsEl; // already declared
  const cal = document.getElementById('mini-cal');
  cal.innerHTML = '';
  for (let off = -2; off <= 4; off++) {
    const d   = new Date(now); d.setDate(today + off);
    const col = document.createElement('div');
    col.className = 'cal-day-col';
    col.innerHTML = `
      <div class="cal-day-name">${DNAMES[d.getDay()]}</div>
      <div class="cal-day-num${off === 0 ? ' today' : ''}">${d.getDate()}</div>`;
    cal.appendChild(col);
  }
}

// ── WEATHER ───────────────────────────────────────────────────────────────────
const WX_ICONS = {
  '01d':'☀️','01n':'🌙','02d':'⛅','02n':'☁️','03d':'☁️','03n':'☁️',
  '04d':'☁️','04n':'☁️','09d':'🌧️','09n':'🌧️','10d':'🌦️','10n':'🌧️',
  '11d':'⛈️','11n':'⛈️','13d':'❄️','13n':'❄️','50d':'🌫️','50n':'🌫️'
};

async function fetchWeather() {
  try {
    const url  = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(OWM_CITY)}&appid=${OWM_API_KEY}&units=${OWM_UNITS}`;
    const res  = await fetch(url);
    const json = await res.json();
    if (json.cod !== 200) throw new Error(json.message);
    document.getElementById('wx-icon').textContent     = WX_ICONS[json.weather[0].icon] || '🌡️';
    document.getElementById('wx-temp').textContent     = `${Math.round(json.main.temp)}°`;
    document.getElementById('wx-desc').textContent     = json.weather[0].description;
    document.getElementById('wx-city').textContent     = `${json.name}, ${json.sys.country}`;
    document.getElementById('wx-humidity').textContent = `💧 ${json.main.humidity}%`;
    document.getElementById('wx-wind').textContent     = `💨 ${Math.round(json.wind.speed * 3.6)} km/h`;
  } catch(e) {
    document.getElementById('wx-desc').textContent = 'Weather unavailable';
    document.getElementById('wx-city').textContent = 'Check API key / city name';
    console.warn('Weather:', e.message);
  }
}

// ── FIREBASE LISTENER ─────────────────────────────────────────────────────────
onValue(postsRef, (snapshot) => {
  data = [];
  if (snapshot.exists()) {
    snapshot.forEach(child => data.push({ _key: child.key, ...child.val() }));
  }
  renderSlides();
  const ls = document.getElementById('loading-screen');
  if (ls) { ls.classList.add('hidden'); setTimeout(() => ls.remove(), 600); }
});

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderSlides() {
  // Remove only slide elements, keep arrow buttons and dots container
  area.querySelectorAll('.slide').forEach(s => s.remove());
  dotsEl.innerHTML = '';

  if (data.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-size:32px;color:#8fa3b8;text-align:center;padding:40px;';
    empty.innerHTML = '<div><div style="font-size:64px;margin-bottom:16px">📭</div>No slides yet.<br><span style="font-family:Sora,sans-serif;font-size:16px;font-weight:400">Add slides from the admin panel.</span></div>';
    area.appendChild(empty);
    slides = [];
    document.getElementById('arrow-prev').style.display = 'none';
    document.getElementById('arrow-next').style.display = 'none';
    return;
  }

  document.getElementById('arrow-prev').style.display = '';
  document.getElementById('arrow-next').style.display = '';

  data.forEach((item, i) => {
    // ── BUILD SLIDE ──
    const slide = document.createElement('div');
    slide.className = 'slide';

    if (item.type === 'text') {
      const theme = item.bgtheme || 'blue';
      slide.classList.add('slide-bg-' + theme);
      // Use textContent-safe insertion
      const inner = document.createElement('div');
      inner.className = 'slide-inner';

      const cat = document.createElement('div');
      cat.className = 'slide-category';
      cat.textContent = item.category || 'Announcement';

      const ttl = document.createElement('div');
      ttl.className = 'slide-title';
      ttl.textContent = item.title || '';

      const cnt = document.createElement('div');
      cnt.className = 'slide-content';
      cnt.textContent = item.content || '';

      inner.appendChild(cat);
      inner.appendChild(ttl);
      inner.appendChild(cnt);
      slide.appendChild(inner);
    }
    else if (item.type === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'slide-image-wrap';

      const img = document.createElement('img');
      img.src = item.mediaUrl || '';
      img.alt = item.title || '';

      const cap = document.createElement('div');
      cap.className = 'slide-image-caption';

      const tag = document.createElement('div');
      tag.className = 'cap-tag';
      tag.textContent = item.category || 'Photo';

      const ctitle = document.createElement('div');
      ctitle.className = 'cap-title';
      ctitle.textContent = item.title || '';

      cap.appendChild(tag);
      cap.appendChild(ctitle);
      wrap.appendChild(img);
      wrap.appendChild(cap);
      slide.appendChild(wrap);
    }
    else if (item.type === 'video') {
      const wrap = document.createElement('div');
      wrap.className = 'slide-video-wrap';

      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';
      video.setAttribute('playsinline', '');

      const src = document.createElement('source');
      src.src  = item.mediaUrl || '';
      src.type = 'video/mp4';
      video.appendChild(src);
      wrap.appendChild(video);
      slide.appendChild(wrap);
    }

    // Insert BEFORE arrows (arrows are last children)
    area.insertBefore(slide, document.getElementById('arrow-prev'));

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', (e) => { e.stopPropagation(); goTo(i); });
    dotsEl.appendChild(dot);
  });

  slides = area.querySelectorAll('.slide');
  currentIndex = 0;
  startSlideshow();
}

// ── SLIDESHOW ENGINE ──────────────────────────────────────────────────────────
function startSlideshow() {
  if (timer) clearTimeout(timer);
  showSlide(currentIndex);
}

function showSlide(idx) {
  if (!slides.length) return;

  // Stop everything first
  if (timer) { clearTimeout(timer); timer = null; }

  slides.forEach((s) => {
    s.classList.remove('active');
    const v = s.querySelector('video');
    if (v) { v.pause(); v.currentTime = 0; v.onended = null; }
  });

  // Update dots
  dotsEl.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });

  // Activate current
  const slide = slides[idx];
  slide.classList.add('active');

  // Info bar transparency: transparent if image or video
  const isMedia = (data[idx]?.type === 'image' || data[idx]?.type === 'video');
  infoBar.classList.toggle('on-media', isMedia);

  // Reset progress bar
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';

  const video = slide.querySelector('video');
  if (video) {
    video.play().catch(() => {});
    video.onended = () => { currentIndex = (currentIndex + 1) % slides.length; showSlide(currentIndex); };
    // Show a progress bar that goes to 100% over video duration once metadata loads
    video.addEventListener('loadedmetadata', function onMeta() {
      video.removeEventListener('loadedmetadata', onMeta);
      const dur = video.duration * 1000 || 10000;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        progressBar.style.transition = `width ${dur}ms linear`;
        progressBar.style.width = '100%';
      }));
    }, { once: true });
    return;
  }

  // Text / Image — use duration
  const duration = Number(data[idx]?.duration) || 7000;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    progressBar.style.transition = `width ${duration}ms linear`;
    progressBar.style.width = '100%';
  }));
  timer = setTimeout(() => {
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }, duration);
}

function goTo(idx) {
  currentIndex = idx;
  showSlide(currentIndex);
}

// ── ARROW BUTTONS ─────────────────────────────────────────────────────────────
document.getElementById('arrow-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + slides.length) % slides.length;
  showSlide(currentIndex);
});

document.getElementById('arrow-next').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % slides.length;
  showSlide(currentIndex);
});

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (!slides.length) return;
  if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + slides.length) % slides.length; showSlide(currentIndex); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % slides.length; showSlide(currentIndex); }
});

// ── INIT ──────────────────────────────────────────────────────────────────────
setInterval(updateClock, 1000);
updateClock();
buildMiniCal();
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);
</script>
