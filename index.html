<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Bulletin Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; }

    #bg {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #0f172a 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.32;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb1 { width: 650px; height: 650px; background: #3b82f6; top: -180px; left: -180px; }
    .orb2 { width: 550px; height: 550px; background: #8b5cf6; bottom: -120px; right: -120px; animation-delay: -5s; }
    .orb3 { width: 380px; height: 380px; background: #06b6d4; top: 38%; left: 33%; animation-delay: -9s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(45px,35px) scale(1.1); }
    }

    #page {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
    }

    /* ── Brand ── */
    .brand-icon {
      width: 80px; height: 80px; border-radius: 22px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; margin-bottom: 28px;
      box-shadow: 0 0 60px rgba(99,102,241,0.4);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 700; color: #fff;
      text-align: center; line-height: 1.15;
      margin-bottom: 14px;
    }
    .subtitle {
      font-size: clamp(14px, 1.6vw, 18px);
      color: rgba(255,255,255,0.45);
      text-align: center; font-weight: 300;
      letter-spacing: 0.02em;
      margin-bottom: 52px;
    }

    /* ── Button group ── */
    .btn-group {
      display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 16px 36px; border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      border: none; outline: none;
      letter-spacing: 0.01em;
    }
    .btn:hover  { transform: translateY(-3px); opacity: 0.93; }
    .btn:active { transform: translateY(0px) scale(0.97); }

    .btn-admin {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 8px 32px rgba(99,102,241,0.45);
    }
    .btn-admin:hover { box-shadow: 0 14px 42px rgba(99,102,241,0.55); }

    .btn-display {
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .btn-display:hover { background: rgba(255,255,255,0.18); box-shadow: 0 14px 36px rgba(0,0,0,0.35); }

    .btn-icon { font-size: 20px; line-height: 1; }

    /* ── Footer note ── */
    .foot {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: rgba(255,255,255,0.2);
      letter-spacing: 0.06em; white-space: nowrap;
    }

    /* ── Login Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: rgba(15,23,42,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 44px 48px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      transform: translateY(24px);
      transition: transform 0.28s ease;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 700; color: #fff;
      margin-bottom: 6px;
    }
    .modal-sub {
      font-size: 13px; color: rgba(255,255,255,0.4);
      margin-bottom: 32px;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.45); margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #fff;
      font-family: 'Outfit', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: rgba(99,102,241,0.7); }
    .field input::placeholder { color: rgba(255,255,255,0.25); }

    .modal-error {
      font-size: 13px; color: #f87171;
      margin-bottom: 16px; min-height: 18px;
    }

    .modal-actions {
      display: flex; gap: 12px; margin-top: 4px;
    }
    .btn-cancel {
      flex: 1; padding: 13px; border-radius: 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.6);
      font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.13); }
    .btn-signin {
      flex: 2; padding: 13px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; color: #fff;
      font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.18s, transform 0.18s;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
    }
    .btn-signin:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn-signin:active { transform: scale(0.98); }
    .btn-signin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

<div id="bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div id="page">
  <div class="brand-icon">📋</div>
  <h1>Digital Bulletin Board</h1>
  <p class="subtitle">Real-time announcements with local weather &amp; calendar</p>

  <div class="btn-group">
    <button class="btn btn-admin" onclick="openLogin()">
      <span class="btn-icon">🔐</span> Admin Login
    </button>
    <a class="btn btn-display" href="bulletin.html" target="_blank">
      <span class="btn-icon">📺</span> Open Display
    </a>
  </div>
</div>

<p class="foot">Digital Bulletin Board · Group 3</p>

<!-- Login Modal -->
<div class="modal-backdrop" id="modal" onclick="handleBackdropClick(event)">
  <div class="modal">
    <div class="modal-title">Admin Login</div>
    <div class="modal-sub">Sign in to manage bulletin board posts</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="modal-error" id="modal-error"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLogin()">Cancel</button>
      <button class="btn-signin" id="signin-btn" onclick="doLogin()">Sign In →</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  storageBucket:     "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};
const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);

window.openLogin = function() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('email').focus();
  document.getElementById('modal-error').textContent = '';
};

window.closeLogin = function() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  document.getElementById('modal-error').textContent = '';
};

window.handleBackdropClick = function(e) {
  if (e.target.id === 'modal') closeLogin();
};

window.doLogin = async function() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('modal-error');
  const btn      = document.getElementById('signin-btn');

  if (!email || !password) {
    errEl.textContent = 'Please enter your email and password.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';
  errEl.textContent = '';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = 'admin.html';
  } catch(e) {
    const msgs = {
      'auth/user-not-found':  'No account found with that email.',
      'auth/wrong-password':  'Incorrect password.',
      'auth/invalid-email':   'Invalid email address.',
      'auth/too-many-requests': 'Too many attempts. Try again later.',
      'auth/invalid-credential': 'Invalid email or password.',
    };
    errEl.textContent = msgs[e.code] || 'Login failed. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Sign In →';
  }
};
</script>
</body>
</html>
