<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board Display</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; overflow:hidden; background:#1e2a4a; }

    /* ── BACKGROUND GRADIENT ── */
    body {
      background: linear-gradient(135deg, #eef2ff 0%, #f0f4ff 40%, #e8f0ff 100%);
      font-family: 'DM Sans', sans-serif;
    }

    /* ── SLIDESHOW CONTAINER ── */
    #show { width:100vw; height:100vh; position:relative; overflow:hidden; }

    /* ── INDIVIDUAL SLIDE ── */
    .slide {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity .8s ease; pointer-events:none;
    }
    .slide.active { opacity:1; pointer-events:auto; }

    /* ── TEXT SLIDE ── */
    .slide-text {
      width:80%; max-width:960px; text-align:center;
      padding:54px 64px;
      background: rgba(255,255,255,0.84);
      backdrop-filter: blur(24px);
      border-radius:28px;
      box-shadow: 0 16px 56px rgba(91,127,255,.14), 0 2px 8px rgba(0,0,0,.05);
      border:1px solid rgba(255,255,255,.92);
      animation: floatIn .7s ease;
    }
    @keyframes floatIn { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }

    .cat-badge {
      display:inline-block; font-size:12px; font-weight:700;
      letter-spacing:.12em; text-transform:uppercase;
      color:#5b7fff; background:#dce5ff; padding:5px 18px;
      border-radius:99px; margin-bottom:22px;
    }
    .slide-title {
      font-family:'Playfair Display',serif;
      font-size:clamp(30px,5vw,58px); color:#1e2a4a; line-height:1.2; margin-bottom:18px;
    }
    .slide-content { font-size:clamp(16px,2.2vw,26px); color:#4a5568; line-height:1.65; font-weight:300; }

    /* ── IMAGE SLIDE ── */
    .slide-image-wrap {
      width:100%; height:100%; position:relative; display:flex; align-items:center; justify-content:center;
    }
    .slide-image-wrap.fullscreen img { width:100%; height:100%; object-fit:cover; }
    .slide-image-wrap:not(.fullscreen) img {
      max-width:88vw; max-height:88vh; border-radius:20px;
      box-shadow:0 20px 64px rgba(0,0,0,.18); object-fit:contain;
    }
    .img-caption {
      position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
      background:rgba(30,42,74,.72); backdrop-filter:blur(12px);
      color:#fff; padding:10px 28px; border-radius:99px;
      font-size:clamp(13px,1.4vw,16px); font-weight:500;
      white-space:nowrap; max-width:80vw; overflow:hidden; text-overflow:ellipsis;
    }
    .img-cat {
      position:absolute; top:28px; left:50%; transform:translateX(-50%);
      background:rgba(91,127,255,.85); backdrop-filter:blur(8px);
      color:#fff; padding:6px 20px; border-radius:99px; font-size:12px; font-weight:700;
      letter-spacing:.1em; text-transform:uppercase;
    }

    /* ── VIDEO SLIDE ── */
    .slide-video-wrap { width:100%; height:100%; }
    .slide-video-wrap.windowed {
      display:flex; align-items:center; justify-content:center;
    }
    .slide-video-wrap.windowed video {
      max-width:92vw; max-height:92vh; border-radius:16px;
      box-shadow:0 20px 64px rgba(0,0,0,.22);
    }
    .slide-video-wrap.fullscreen video { width:100%; height:100%; object-fit:cover; }

    /* ── PROGRESS BAR ── */
    #progress-wrap {
      position:fixed; bottom:0; left:0; right:0; height:3px;
      background:rgba(255,255,255,.2); z-index:10;
    }
    #progress-bar {
      height:100%; background:linear-gradient(90deg,#5b7fff,#a78bfa);
      width:0%; transition:width linear; border-radius:0 2px 0 0;
    }

    /* ── SLIDE COUNTER ── */
    #counter {
      position:fixed; bottom:14px; right:20px;
      font-size:12px; color:rgba(30,42,74,.45); font-weight:500; z-index:10; letter-spacing:.05em;
    }

    /* ── LOADING ── */
    #loader {
      position:fixed; inset:0; background:var(--bg,#eef2ff);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999;
    }
    .loader-icon { font-size:40px; animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    .loader-text { font-size:14px; color:#7a87a8; }
  </style>
</head>
<body>

<div id="loader">
  <div class="loader-icon">📋</div>
  <div class="loader-text">Loading bulletin board...</div>
</div>

<div id="show"></div>

<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="counter"></div>

<script type="module">
// ── FIREBASE CONFIG — paste yours here ───────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain: "digitalbulletinboard-54f06.firebaseapp.com",
  projectId: "digitalbulletinboard-54f06",
  storageBucket: "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId: "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
// ─────────────────────────────────────────────────────────────────────────────

let slides   = [];
let current  = 0;
let timer    = null;
let progTimer = null;

// ── FETCH POSTS REALTIME ──────────────────────────────────────────────────────
onValue(ref(db, 'posts'), snap => {
  slides = [];
  if (snap.exists()) snap.forEach(c => slides.push(c.val()));
  document.getElementById('loader').style.display = 'none';
  buildSlides();
  startShow();
});

// ── BUILD SLIDE DOM ───────────────────────────────────────────────────────────
function buildSlides() {
  const show = document.getElementById('show');
  show.innerHTML = '';

  if (slides.length === 0) {
    show.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:20px;color:#7a87a8;">No posts yet. Add some from the Admin Panel.</div>`;
    return;
  }

  slides.forEach((item, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.id = 'slide-' + i;

    if (item.type === 'text') {
      slide.innerHTML = `
        <div class="slide-text">
          ${item.category ? `<div class="cat-badge">${item.category}</div>` : ''}
          <div class="slide-title">${item.title}</div>
          ${item.content ? `<div class="slide-content">${item.content}</div>` : ''}
        </div>`;
    }

    else if (item.type === 'image') {
      const fs = item.fullscreen ? 'fullscreen' : '';
      slide.innerHTML = `
        <div class="slide-image-wrap ${fs}">
          <img src="${item.imageUrl || item.url}" alt="${item.title}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><text y=%22100%22 font-size=%2260%22>🖼️</text></svg>'">
          ${item.category ? `<div class="img-cat">${item.category}</div>` : ''}
          ${item.title    ? `<div class="img-caption">${item.title}</div>` : ''}
        </div>`;
    }

    else if (item.type === 'video') {
      const cls = item.fullscreen ? 'fullscreen' : 'windowed';
      slide.innerHTML = `
        <div class="slide-video-wrap ${cls}">
          <video autoplay muted playsinline loop>
            <source src="${item.url}" type="video/mp4">
          </video>
        </div>`;
    }

    show.appendChild(slide);
  });
}

// ── SLIDESHOW LOGIC ───────────────────────────────────────────────────────────
function startShow() {
  if (slides.length === 0) return;
  clearTimeout(timer);
  showSlide(0);
}

function showSlide(idx) {
  if (slides.length === 0) return;
  current = ((idx % slides.length) + slides.length) % slides.length;

  // Remove active from all
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));

  const el = document.getElementById('slide-' + current);
  if (!el) return;
  el.classList.add('active');

  // Auto-play video
  const vid = el.querySelector('video');
  if (vid) vid.play().catch(()=>{});

  // Counter
  document.getElementById('counter').textContent = `${current+1} / ${slides.length}`;

  // Progress bar
  const dur = slides[current]?.duration || 5000;
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none'; bar.style.width = '0%';
  setTimeout(() => { bar.style.transition = `width ${dur}ms linear`; bar.style.width = '100%'; }, 30);

  // Next slide timer
  clearTimeout(timer);
  timer = setTimeout(() => showSlide(current + 1), dur);
}
</script>
</body>
</html>
