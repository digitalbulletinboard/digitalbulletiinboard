<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    :root {
      --blue:   #3b82f6;
      --indigo: #6366f1;
      --violet: #8b5cf6;
      --cyan:   #06b6d4;
      --emerald:#10b981;
      --wx-bg:  rgba(56,189,248,0.18);
      --wx-bdr: rgba(56,189,248,0.45);
      --cal-bg: rgba(99,102,241,0.16);
      --cal-bdr:rgba(99,102,241,0.40);
      --sl-bg:  rgba(16,185,129,0.15);
      --sl-bdr: rgba(16,185,129,0.38);
    }

    body { font-family: 'Outfit', sans-serif; background: #0c1120; color: white; }

    /* ── BACKGROUND ── */
    #bg-canvas { position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0c1120 0%,#1a1040 50%,#0c1120 100%); }
    .orb { position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 14s ease-in-out infinite alternate; }
    .orb1 { width:700px;height:700px;background:#3b82f6;top:-200px;left:-200px;animation-delay:0s; }
    .orb2 { width:550px;height:550px;background:#8b5cf6;bottom:-150px;right:-150px;animation-delay:-5s; }
    .orb3 { width:400px;height:400px;background:#06b6d4;top:50%;left:40%;animation-delay:-9s; }
    @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(35px,25px) scale(1.07)} }

    /* ── LAYOUT ── */
    #app {
      position:relative;z-index:1;
      width:100vw;height:100vh;
      display:grid;
      grid-template-rows:52px 1fr 4px;
      grid-template-columns:1fr;
      grid-template-areas:"topbar""slides""prog";
    }

    /* ════════════════════════════════════════════
       TOP BAR  — 52px fixed, no overflow
    ════════════════════════════════════════════ */
    #topbar {
      grid-area:topbar;
      display:flex;align-items:center;gap:0;
      padding:0 14px;
      height:52px;
      background:rgba(8,14,30,0.85);
      backdrop-filter:blur(24px);
      border-bottom:1px solid rgba(255,255,255,0.08);
      overflow:hidden;
    }

    /* Brand */
    .tb-brand {
      display:flex;align-items:center;gap:7px;
      flex-shrink:0;padding-right:14px;
      border-right:1px solid rgba(255,255,255,0.10);
      height:100%;
    }
    .tb-icon {
      font-size:16px;
      background:linear-gradient(135deg,var(--blue),var(--violet));
      width:30px;height:30px;border-radius:8px;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .tb-name {
      font-family:'Playfair Display',serif;
      font-size:14px;font-weight:700;color:white;white-space:nowrap;
    }

    /* Widget strip */
    .tb-widgets { display:flex;align-items:stretch;flex:1;overflow:hidden;height:100%; }

    /* ── WEATHER ── */
    .tb-wx {
      display:flex;align-items:center;gap:6px;
      padding:0 12px;flex-shrink:0;
      background:var(--wx-bg);
      border-right:1px solid var(--wx-bdr);
    }
    .tbwx-ico  { font-size:22px;line-height:1;flex-shrink:0; }
    .tbwx-temp { font-size:16px;font-weight:800;color:#bae6fd;line-height:1;letter-spacing:-0.02em; }
    .tbwx-desc { font-size:9px;color:rgba(186,230,253,.65);white-space:nowrap; }
    .tbwx-chips { display:flex;gap:4px;margin-left:4px; }
    .tbwx-chip {
      display:flex;flex-direction:column;align-items:center;
      background:rgba(56,189,248,.22);border:1px solid rgba(56,189,248,.32);
      border-radius:5px;padding:2px 5px;
    }
    .tbwx-clabel { font-size:7px;color:rgba(186,230,253,.55);letter-spacing:.05em;text-transform:uppercase;line-height:1; }
    .tbwx-cval   { font-size:11px;font-weight:700;color:#e0f2fe;line-height:1.3; }
    .tbwx-loc    { font-size:8px;color:rgba(186,230,253,.38);white-space:nowrap;margin-left:2px; }

    /* ── CALENDAR ── */
    .tb-cal {
      display:flex;align-items:center;gap:8px;
      padding:0 10px;flex-shrink:0;
      background:var(--cal-bg);
      border-right:1px solid var(--cal-bdr);
    }
    .tbcal-hdr  { display:flex;flex-direction:column;gap:2px;flex-shrink:0; }
    .tbcal-lbl  { font-size:8px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:rgba(165,180,252,.55); }
    .tbcal-nav  { display:flex;align-items:center;gap:3px; }
    .tbcal-nav button {
      background:rgba(99,102,241,.30);border:1px solid rgba(99,102,241,.42);
      color:#a5b4fc;width:17px;height:17px;border-radius:4px;
      cursor:pointer;font-size:10px;
      display:flex;align-items:center;justify-content:center;
      transition:background .2s;flex-shrink:0;padding:0;
    }
    .tbcal-nav button:hover { background:rgba(99,102,241,.55);color:white; }
    .tbcal-mname { font-size:11px;font-weight:700;color:#c7d2fe;white-space:nowrap;min-width:54px;text-align:center; }

    /* Grid: 7 columns of 18px each, rows auto-sized at 12px */
    .tbcal-grid {
      display:grid;
      grid-template-columns:repeat(7,18px);
      grid-auto-rows:12px;
      gap:1px 0;
      text-align:center;
      flex-shrink:0;
    }
    .tbcal-dow { font-size:7px;font-weight:700;letter-spacing:.04em;color:rgba(165,180,252,.45);line-height:12px; }
    .tbcal-day { font-size:9px;line-height:12px;border-radius:3px;color:rgba(199,210,254,.60);cursor:default;transition:background .15s; }
    .tbcal-day.other { color:rgba(165,180,252,.20); }
    .tbcal-day.today { background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:800;border-radius:3px; }

    /* ── SLIDES ── */
    .tb-slides {
      display:flex;align-items:center;gap:5px;
      padding:0 10px;flex:1;min-width:0;overflow:hidden;
      background:var(--sl-bg);
      border-right:1px solid var(--sl-bdr);
    }
    .tbsl-lbl { font-size:8px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:rgba(110,231,183,.55);flex-shrink:0; }
    .tbsl-row { display:flex;gap:4px;overflow:hidden;flex:1; }
    .tbsl-pill {
      display:flex;align-items:center;gap:3px;
      background:rgba(16,185,129,.18);border:1px solid rgba(16,185,129,.30);
      border-radius:6px;padding:2px 7px;
      cursor:pointer;transition:all .18s;
      flex-shrink:0;max-width:110px;
    }
    .tbsl-pill.cur { background:rgba(16,185,129,.36);border-color:rgba(110,231,183,.60); }
    .tbsl-dot      { width:5px;height:5px;border-radius:50%;flex-shrink:0; }
    .dot-text      { background:#60a5fa; }
    .dot-image     { background:#34d399; }
    .dot-video     { background:#fbbf24; }
    .tbsl-name     { font-size:9px;color:rgba(110,231,183,.70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .tbsl-pill.cur .tbsl-name { color:#6ee7b7;font-weight:700; }

    /* ── CLOCK ── */
    #clock-wrap {
      flex-shrink:0;text-align:right;
      padding:0 0 0 12px;
      border-left:1px solid rgba(255,255,255,0.09);
    }
    #clock-time {
      font-size:20px;font-weight:800;letter-spacing:-0.02em;
      background:linear-gradient(90deg,#93c5fd,#c4b5fd);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      line-height:1;
    }
    #clock-date {
      font-size:8px;color:rgba(255,255,255,.38);
      letter-spacing:.07em;text-transform:uppercase;
      margin-top:1px;white-space:nowrap;
    }

    /* ════════════════════════
       SLIDES
    ════════════════════════ */
    #slideshow { grid-area:slides;position:relative;overflow:hidden; }

    .slide {
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity .85s ease;pointer-events:none;
    }
    .slide.active { opacity:1;pointer-events:auto; }

    .slide-text {
      width:78%;max-width:860px;text-align:center;
      padding:48px 60px;
      background:rgba(255,255,255,.09);
      backdrop-filter:blur(32px);
      border-radius:26px;
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 28px 72px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.12);
      animation:floatUp .6s ease;
    }
    @keyframes floatUp { from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:translateY(0)} }
    .cat-pill {
      display:inline-block;font-size:11px;font-weight:700;
      letter-spacing:.13em;text-transform:uppercase;
      color:#93c5fd;background:rgba(59,130,246,.22);
      border:1px solid rgba(59,130,246,.35);
      padding:4px 16px;border-radius:99px;margin-bottom:18px;
    }
    .slide-title {
      font-family:'Playfair Display',serif;
      font-size:clamp(28px,4.5vw,58px);font-weight:700;color:white;
      line-height:1.18;margin-bottom:16px;
    }
    .slide-body { font-size:clamp(14px,1.8vw,22px);color:rgba(255,255,255,.70);line-height:1.7;font-weight:300; }

    .img-wrap { width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center; }
    .img-wrap.fs img { width:100%;height:100%;object-fit:cover; }
    .img-wrap:not(.fs) img { max-width:88vw;max-height:88vh;object-fit:contain;border-radius:20px;box-shadow:0 24px 72px rgba(0,0,0,.5); }
    .img-cat { position:absolute;top:22px;left:50%;transform:translateX(-50%);background:rgba(99,102,241,.82);backdrop-filter:blur(10px);color:#fff;padding:5px 18px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase; }
    .img-caption { position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(10,16,36,.78);backdrop-filter:blur(14px);color:#fff;padding:9px 26px;border-radius:99px;font-size:clamp(12px,1.4vw,16px);font-weight:500;white-space:nowrap;max-width:82vw;overflow:hidden;text-overflow:ellipsis; }

    .vid-wrap.fs { width:100%;height:100%; }
    .vid-wrap.fs video { width:100%;height:100%;object-fit:cover; }
    .vid-wrap.windowed { width:100%;height:100%;display:flex;align-items:center;justify-content:center; }
    .vid-wrap.windowed video { max-width:90vw;max-height:88vh;border-radius:16px;box-shadow:0 24px 72px rgba(0,0,0,.5); }

    /* ── PROGRESS ── */
    #prog { grid-area:prog;background:rgba(255,255,255,.07); }
    #prog-bar {
      height:100%;width:0%;
      background:linear-gradient(90deg,#3b82f6,#8b5cf6,#3b82f6);
      background-size:200% 100%;
      animation:shimmer 2.5s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    #counter {
      position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
      font-size:10px;color:rgba(255,255,255,.22);letter-spacing:.10em;font-weight:600;z-index:20;
    }

    /* ── LOADER ── */
    #loader {
      position:fixed;inset:0;z-index:999;background:#0c1120;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    }
    .ld-ring { width:48px;height:48px;border:3px solid rgba(255,255,255,.08);border-top-color:#6366f1;border-radius:50%;animation:spin .9s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .ld-text { font-size:13px;color:rgba(255,255,255,.35);letter-spacing:.05em; }
    #loader.hidden { opacity:0;pointer-events:none;transition:opacity .4s ease; }
  </style>
</head>
<body>

<div id="bg-canvas">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div id="loader">
  <div class="ld-ring"></div>
  <div class="ld-text">Loading bulletin board…</div>
</div>

<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">

    <div class="tb-brand">
      <div class="tb-icon">📋</div>
      <div class="tb-name">Bulletin Board</div>
    </div>

    <div class="tb-widgets">

      <!-- Weather -->
      <div class="tb-wx">
        <div class="tbwx-ico" id="tbwx-ico">🌡</div>
        <div>
          <div class="tbwx-temp" id="tbwx-temp">--°C</div>
          <div class="tbwx-desc" id="tbwx-desc">Detecting…</div>
        </div>
        <div class="tbwx-chips" id="tbwx-chips"></div>
        <div class="tbwx-loc" id="tbwx-loc"></div>
      </div>

      <!-- Calendar -->
      <div class="tb-cal">
        <div class="tbcal-hdr">
          <div class="tbcal-lbl">Calendar</div>
          <div class="tbcal-nav">
            <button onclick="calNav(-1)">‹</button>
            <span class="tbcal-mname" id="cal-mname">—</span>
            <button onclick="calNav(1)">›</button>
          </div>
        </div>
        <div class="tbcal-grid" id="cal-grid"></div>
      </div>

      <!-- Slides -->
      <div class="tb-slides">
        <div class="tbsl-lbl">Slides</div>
        <div class="tbsl-row" id="slide-items"></div>
      </div>

    </div>

    <!-- Clock -->
    <div id="clock-wrap">
      <div id="clock-time">--:--:--</div>
      <div id="clock-date">…</div>
    </div>

  </div>

  <!-- SLIDESHOW -->
  <div id="slideshow"></div>

  <!-- PROGRESS -->
  <div id="prog"><div id="prog-bar"></div></div>

</div>

<div id="counter"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  storageBucket:     "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── CLOCK ──────────────────────────────────────────────────────────────────
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function tickClock() {
  const n = new Date();
  const hh = String(n.getHours()).padStart(2,'0');
  const mm = String(n.getMinutes()).padStart(2,'0');
  const ss = String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock-time').textContent = `${hh}:${mm}:${ss}`;
  document.getElementById('clock-date').textContent =
    `${DAY_NAMES[n.getDay()]}, ${MON_NAMES[n.getMonth()]} ${n.getDate()}, ${n.getFullYear()}`;
}
tickClock();
setInterval(tickClock, 1000);

// ── CALENDAR ───────────────────────────────────────────────────────────────
const today = new Date();
let calY = today.getFullYear(), calM = today.getMonth();

window.calNav = function(d) {
  calM += d;
  if (calM > 11) { calM = 0; calY++; }
  if (calM < 0)  { calM = 11; calY--; }
  renderCal();
};

function renderCal() {
  const MNAMES = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const DOW    = ['S','M','T','W','T','F','S'];

  document.getElementById('cal-mname').textContent =
    `${MNAMES[calM].slice(0,3)} ${calY}`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'tbcal-dow'; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay    = new Date(calY, calM, 1).getDay();
  const daysInMonth = new Date(calY, calM + 1, 0).getDate();
  const prevDays    = new Date(calY, calM, 0).getDate();

  for (let i = firstDay - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'tbcal-day other';
    el.textContent = prevDays - i;
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'tbcal-day';
    if (d === today.getDate() && calM === today.getMonth() && calY === today.getFullYear())
      el.classList.add('today');
    el.textContent = d;
    grid.appendChild(el);
  }

  const total = firstDay + daysInMonth;
  const rem   = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= rem; d++) {
    const el = document.createElement('div');
    el.className = 'tbcal-day other'; el.textContent = d;
    grid.appendChild(el);
  }
}
renderCal();

// ── WEATHER ────────────────────────────────────────────────────────────────
const WX_DESC = {
  0:'Clear Sky',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Icy Fog',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',71:'Light Snow',73:'Snow',
  75:'Heavy Snow',77:'Snow Grains',80:'Showers',81:'Heavy Showers',
  82:'Violent Showers',85:'Snow Showers',86:'Heavy Snow Showers',
  95:'Thunderstorm',96:'Thunderstorm+Hail',99:'Thunderstorm+Heavy Hail'
};
const WX_ICO = {
  0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',
  51:'🌦',53:'🌧',55:'🌧',61:'🌦',63:'🌧',65:'🌧',
  71:'🌨',73:'❄️',75:'❄️',77:'❄️',80:'🌦',81:'🌧',82:'⛈',
  85:'🌨',86:'❄️',95:'⛈',96:'⛈',99:'⛈'
};

async function loadWx(lat, lon, loc) {
  try {
    const r = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,relative_humidity_2m`+
      `&temperature_unit=celsius&windspeed_unit=kmh&timezone=auto`
    );
    const d = await r.json(), c = d.current, code = c.weathercode;
    document.getElementById('tbwx-ico').textContent  = WX_ICO[code]  || '🌡';
    document.getElementById('tbwx-temp').textContent = `${Math.round(c.temperature_2m)}°C`;
    document.getElementById('tbwx-desc').textContent = WX_DESC[code] || 'Unknown';
    document.getElementById('tbwx-loc').textContent  = `📍 ${loc}`;
    document.getElementById('tbwx-chips').innerHTML  = `
      <div class="tbwx-chip"><span class="tbwx-clabel">FEELS</span><span class="tbwx-cval">${Math.round(c.apparent_temperature)}°</span></div>
      <div class="tbwx-chip"><span class="tbwx-clabel">HUMID</span><span class="tbwx-cval">${c.relative_humidity_2m}%</span></div>
      <div class="tbwx-chip"><span class="tbwx-clabel">WIND</span><span class="tbwx-cval">${Math.round(c.windspeed_10m)}km/h</span></div>`;
  } catch { document.getElementById('tbwx-desc').textContent = 'Unavailable'; }
}

function initWx() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => loadWx(p.coords.latitude, p.coords.longitude,
                  `${p.coords.latitude.toFixed(2)}°N, ${p.coords.longitude.toFixed(2)}°E`),
      () => loadWx(10.3157, 123.8854, 'Cebu City, PH'),
      { timeout: 6000 }
    );
  } else { loadWx(10.3157, 123.8854, 'Cebu City, PH'); }
}
initWx();
setInterval(initWx, 10 * 60 * 1000);

// ── SLIDESHOW ──────────────────────────────────────────────────────────────
let slides = [], cur = 0, timer = null, started = false;

const safe = s => {
  const d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
};

onValue(ref(db,'posts'), snap => {
  slides = [];
  if (snap.exists()) snap.forEach(c => slides.push(c.val()));
  document.getElementById('loader').classList.add('hidden');
  buildDOM();
  renderList();
  if (!started) { started = true; go(0); }
  else if (cur >= slides.length) go(0);
});

function buildDOM() {
  const c = document.getElementById('slideshow');
  c.innerHTML = '';
  if (!slides.length) {
    c.innerHTML = `<div style="display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.28)"><div style="font-size:48px">📭</div><div style="font-size:16px">No posts yet.</div></div>`;
    return;
  }
  slides.forEach((item, i) => {
    const s = document.createElement('div');
    s.className = 'slide'; s.id = 'sl-'+i;
    if (item.type === 'text') {
      s.innerHTML = `<div class="slide-text">
        ${item.category ? `<div class="cat-pill">${safe(item.category)}</div>` : ''}
        <div class="slide-title">${safe(item.title)}</div>
        ${item.content  ? `<div class="slide-body">${safe(item.content)}</div>` : ''}
      </div>`;
    } else if (item.type === 'image') {
      s.innerHTML = `<div class="img-wrap ${item.fullscreen?'fs':''}">
        <img src="${safe(item.imageUrl||item.url)}" alt="${safe(item.title)}" onerror="this.style.display='none'">
        ${item.category ? `<div class="img-cat">${safe(item.category)}</div>`   : ''}
        ${item.title    ? `<div class="img-caption">${safe(item.title)}</div>` : ''}
      </div>`;
    } else if (item.type === 'video') {
      s.innerHTML = `<div class="vid-wrap ${item.fullscreen?'fs':'windowed'}">
        <video autoplay muted playsinline preload="auto">
          <source src="${safe(item.url)}" type="video/mp4">
        </video>
      </div>`;
    }
    c.appendChild(s);
  });
}

function renderList() {
  const row = document.getElementById('slide-items');
  row.innerHTML = '';
  slides.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'tbsl-pill' + (i === cur ? ' cur' : '');
    el.id = 'sli-'+i;
    el.onclick = () => { clearTimeout(timer); go(i); };
    const dc = item.type==='video' ? 'dot-video' : item.type==='image' ? 'dot-image' : 'dot-text';
    el.innerHTML = `<span class="tbsl-dot ${dc}"></span><span class="tbsl-name">${safe(item.title||item.type||'Slide')}</span>`;
    row.appendChild(el);
  });
}

function highlightList() {
  document.querySelectorAll('.tbsl-pill').forEach((el, i) => el.classList.toggle('cur', i === cur));
  document.getElementById('sli-'+cur)?.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function go(idx) {
  if (!slides.length) return;
  cur = ((idx % slides.length) + slides.length) % slides.length;

  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('sl-'+cur);
  if (!el) return;
  el.classList.add('active');

  const vid = el.querySelector('video');
  if (vid) { vid.currentTime = 0; vid.play().catch(()=>{}); }

  document.getElementById('counter').textContent = `${cur+1} / ${slides.length}`;

  const dur = Number(slides[cur]?.duration) || 5000;
  const bar = document.getElementById('prog-bar');
  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${dur}ms linear`;
    bar.style.width = '100%';
  }));

  highlightList();
  clearTimeout(timer);
  timer = setTimeout(() => go(cur + 1), dur);
}
</script>
</body>
</html>
