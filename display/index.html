<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    :root {
      --ink:     #0f172a;
      --ink2:    #334155;
      --muted:   #64748b;
      --blue:    #3b82f6;
      --indigo:  #6366f1;
      --violet:  #8b5cf6;
      --surface: rgba(255,255,255,0.92);
      --glass:   rgba(255,255,255,0.14);
      --glassbg: rgba(15,23,42,0.42);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      color: white;
    }

    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #0f172a 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb1 { width: 600px; height: 600px; background: #3b82f6; top: -150px; left: -150px; animation-delay: 0s; }
    .orb2 { width: 500px; height: 500px; background: #8b5cf6; bottom: -100px; right: -100px; animation-delay: -4s; }
    .orb3 { width: 350px; height: 350px; background: #06b6d4; top: 40%; left: 35%; animation-delay: -8s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    #app {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
    }

    /* ── TOP BAR — floats over slides, glass-transparent ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 0;
      padding: 0 20px;
      height: 56px;
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .tb-brand {
      display: flex; align-items: center; gap: 9px;
      flex-shrink: 0; padding-right: 20px;
      border-right: 1px solid rgba(255,255,255,0.10);
    }
    .tb-icon {
      font-size: 18px;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-name {
      font-family: 'Playfair Display', serif;
      font-size: 16px; font-weight: 700; color: white; white-space: nowrap;
    }

    .tb-widgets {
      display: flex; align-items: center; gap: 0;
      flex: 1; overflow: hidden; height: 100%;
      min-width: 0;
    }

    .tb-div {
      width: 1px; height: 36px; background: rgba(255,255,255,0.10);
      flex-shrink: 0;
    }

    /* ── Weather ── */
    .tb-weather {
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px; height: 100%; flex-shrink: 0;
    }
    .tbwx-icon { font-size: 26px; line-height: 1; }
    .tbwx-temp {
      font-size: 18px; font-weight: 700; color: white;
      line-height: 1; letter-spacing: -0.02em;
    }
    .tbwx-desc {
      font-size: 10px; color: rgba(255,255,255,0.45);
      white-space: nowrap; letter-spacing: 0.02em;
    }
    .tbwx-details {
      display: flex; gap: 6px; margin-left: 4px;
    }
    .tbwx-chip {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(255,255,255,0.07); border-radius: 7px;
      padding: 3px 7px;
    }
    .tbwx-chip-label { font-size: 8px; color: rgba(255,255,255,0.35); letter-spacing: 0.06em; text-transform: uppercase; }
    .tbwx-chip-val   { font-size: 11px; font-weight: 600; color: white; }
    .tbwx-loc {
      font-size: 9px; color: rgba(255,255,255,0.3);
      white-space: nowrap; margin-left: 2px;
    }

    /* ── Calendar — FIXED: wider cells, no overflow ── */
    .tb-cal {
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px; height: 100%; flex-shrink: 0;
    }
    .tbcal-left {}
    .tbcal-month {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      margin-bottom: 2px;
    }
    .tbcal-nav {
      display: flex; align-items: center; gap: 4px;
    }
    .tbcal-nav button {
      background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.6);
      width: 20px; height: 20px; border-radius: 5px;
      cursor: pointer; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .tbcal-nav button:hover { background: rgba(255,255,255,0.18); color: white; }
    .tbcal-month-label { font-size: 12px; font-weight: 600; color: white; min-width: 60px; text-align: center; }
    /* FIXED: increased cell width from 22px to 26px so dates don't get clipped */
    .tbcal-grid {
      display: grid; grid-template-columns: repeat(7, 26px);
      gap: 1px; text-align: center;
    }
    .tbcal-dow {
      font-size: 8px; font-weight: 700; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.25); padding: 1px 0;
    }
    .tbcal-day {
      font-size: 10px; padding: 2px 0;
      border-radius: 4px; color: rgba(255,255,255,0.45);
      cursor: default; transition: background 0.15s; line-height: 1.6;
    }
    .tbcal-day.other { color: rgba(255,255,255,0.15); }
    .tbcal-day.today {
      background: linear-gradient(135deg, var(--blue), var(--violet));
      color: white; font-weight: 700;
    }

    /* ── Slide List ── */
    .tb-slides {
      display: flex; align-items: center; gap: 6px;
      padding: 0 14px; height: 100%;
      flex: 1; overflow: hidden; min-width: 0;
    }
    .tbsl-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.10em;
      text-transform: uppercase; color: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .tbsl-items {
      display: flex; gap: 5px; overflow: hidden;
      flex: 1; min-width: 0;
    }
    .tbsl-item {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid transparent;
      border-radius: 7px; padding: 3px 8px;
      cursor: pointer; transition: all 0.18s;
      flex-shrink: 0; max-width: 100px;
    }
    .tbsl-item.current {
      background: rgba(99,102,241,0.28);
      border-color: rgba(99,102,241,0.50);
    }
    .tbsl-dot {
      width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    }
    .tbsl-text {
      font-size: 10px; color: rgba(255,255,255,0.45);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tbsl-item.current .tbsl-text { color: #c7d2fe; font-weight: 600; }

    /* Clock */
    #clock-display {
      flex-shrink: 0; text-align: right;
      padding-left: 16px;
      border-left: 1px solid rgba(255,255,255,0.10);
    }
    #clock-time {
      font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(90deg, #93c5fd, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    #clock-date {
      font-size: 9px; color: rgba(255,255,255,0.4);
      letter-spacing: 0.07em; text-transform: uppercase;
      margin-top: 2px; white-space: nowrap;
    }

    /* ── Admin Login Button ── */
    #admin-login-btn {
      flex-shrink: 0;
      margin-left: 14px;
      padding: 7px 15px;
      border-radius: 8px;
      background: rgba(99,102,241,0.22);
      border: 1px solid rgba(99,102,241,0.45);
      color: #c7d2fe;
      font-family: 'Outfit', sans-serif;
      font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: background 0.18s, border-color 0.18s;
      display: flex; align-items: center; gap: 6px;
    }
    #admin-login-btn:hover {
      background: rgba(99,102,241,0.38);
      border-color: rgba(99,102,241,0.7);
      color: #fff;
    }

    /* ── Login Modal ── */
    #login-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #login-backdrop.open { opacity: 1; pointer-events: auto; }
    #login-modal {
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 40px 44px;
      width: 100%; max-width: 400px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      transform: translateY(22px) scale(0.97);
      transition: transform 0.28s ease;
    }
    #login-backdrop.open #login-modal { transform: translateY(0) scale(1); }
    #login-modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px; font-weight: 700; color: #fff;
      margin-bottom: 4px;
    }
    #login-modal .lm-sub {
      font-size: 13px; color: rgba(255,255,255,0.38);
      margin-bottom: 28px;
    }
    .lm-field { margin-bottom: 16px; }
    .lm-field label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.4); margin-bottom: 7px;
    }
    .lm-field input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9px; color: #fff;
      font-family: 'Outfit', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    .lm-field input:focus { border-color: rgba(99,102,241,0.7); }
    .lm-field input::placeholder { color: rgba(255,255,255,0.22); }
    #lm-error {
      font-size: 13px; color: #f87171;
      min-height: 18px; margin-bottom: 14px;
    }
    .lm-actions { display: flex; gap: 10px; }
    .lm-cancel {
      flex: 1; padding: 12px; border-radius: 9px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.55);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background 0.18s;
    }
    .lm-cancel:hover { background: rgba(255,255,255,0.13); }
    .lm-submit {
      flex: 2; padding: 12px; border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; color: #fff;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.18s, transform 0.18s;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
    }
    .lm-submit:hover  { opacity: 0.9; transform: translateY(-1px); }
    .lm-submit:active { transform: scale(0.98); }
    .lm-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── SLIDES — full viewport ── */
    #slideshow {
      position: fixed; inset: 0; z-index: 1;
      overflow: hidden;
    }

    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.9s ease; pointer-events: none;
    }
    .slide.active { opacity: 1; pointer-events: auto; }

    /* TEXT SLIDE — FIXED: word-wrap, text flows downward */
    .slide-text {
      width: 78%; max-width: 860px;
      text-align: center;
      padding: 52px 64px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(32px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 32px 80px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
      animation: floatUp 0.65s ease;
      /* FIXED: ensure text wraps downward, no horizontal overflow */
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      overflow: hidden;
    }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cat-pill {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #93c5fd;
      background: rgba(59,130,246,0.22);
      border: 1px solid rgba(59,130,246,0.35);
      padding: 5px 18px; border-radius: 99px; margin-bottom: 22px;
      /* FIXED: wrap long category text */
      word-break: break-word; white-space: normal;
    }
    /* FIXED: title wraps downward, no horizontal scroll */
    .slide-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4.5vw, 58px);
      font-weight: 700; color: white;
      line-height: 1.18; margin-bottom: 18px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
    }
    /* FIXED: body text wraps downward */
    .slide-body {
      font-size: clamp(15px, 1.8vw, 22px);
      color: rgba(255,255,255,0.72);
      line-height: 1.7; font-weight: 300;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
    }

    /* IMAGE SLIDE — blurred backdrop fills gaps, main image stays uncropped */
    .img-wrap {
      width: 100%; height: 100%;
      position: relative; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Blurred background fills the letterbox/pillarbox gaps */
    .img-wrap .img-blur-bg {
      position: absolute; inset: -20px;
      background-size: cover; background-position: center;
      filter: blur(28px) brightness(0.55) saturate(1.3);
      transform: scale(1.08);
      z-index: 0;
    }
    /* Main image stays fully visible, centered on top */
    .img-wrap.fs img {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .img-wrap:not(.fs) img {
      position: relative; z-index: 1;
      max-width: 88vw; max-height: 82vh; object-fit: contain;
      border-radius: 20px; box-shadow: 0 24px 72px rgba(0,0,0,0.5);
    }
    .img-cat {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(99,102,241,0.82); backdrop-filter: blur(10px);
      color: #fff; padding: 6px 20px; border-radius: 99px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      z-index: 2;
    }
    .img-caption {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.75); backdrop-filter: blur(14px);
      color: #fff; padding: 10px 28px; border-radius: 99px;
      font-size: clamp(13px,1.4vw,16px); font-weight: 500;
      white-space: nowrap; max-width: 82vw; overflow: hidden; text-overflow: ellipsis;
      z-index: 2;
    }

    /* VIDEO SLIDE */
    .vid-wrap.fs { width: 100%; height: 100%; }
    .vid-wrap.fs video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .vid-wrap.windowed {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .vid-wrap.windowed video {
      max-width: 90vw; max-height: 84vh;
      border-radius: 16px; box-shadow: 0 24px 72px rgba(0,0,0,0.5);
    }

    /* ── PROGRESS BAR — fixed at very bottom ── */
    #prog-wrap {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      height: 4px; background: rgba(255,255,255,0.08);
    }
    #prog-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
      border-radius: 0 2px 0 0;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    #counter {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: rgba(255,255,255,0.25);
      letter-spacing: 0.1em; font-weight: 600; z-index: 20;
    }

    /* ── LOADER ── */
    #loader {
      position: fixed; inset: 0; z-index: 999;
      background: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .ld-ring {
      width: 56px; height: 56px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ld-text { font-size: 14px; color: rgba(255,255,255,0.4); letter-spacing: 0.05em; }
    #loader.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
  </style>
</head>
<body>

<div id="bg-canvas">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div id="loader">
  <div class="ld-ring"></div>
  <div class="ld-text">Loading bulletin board…</div>
</div>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="tb-brand">
      <div class="tb-icon">📋</div>
      <div class="tb-name">Bulletin Board</div>
    </div>

    <div class="tb-widgets">
      <div class="tb-div"></div>
      <div class="tb-weather">
        <div class="tbwx-icon" id="tbwx-icon">🌡</div>
        <div class="tbwx-info">
          <div class="tbwx-temp" id="tbwx-temp">--°C</div>
          <div class="tbwx-desc" id="tbwx-desc">Loading…</div>
        </div>
        <div class="tbwx-details" id="tbwx-details"></div>
        <div class="tbwx-loc" id="tbwx-loc"></div>
      </div>

      <div class="tb-div"></div>
      <div class="tb-cal">
        <div class="tbcal-left">
          <div class="tbcal-month">Calendar</div>
          <div class="tbcal-nav">
            <button onclick="calNav(-1)">‹</button>
            <span class="tbcal-month-label" id="cal-month-label">—</span>
            <button onclick="calNav(1)">›</button>
          </div>
        </div>
        <div class="tbcal-grid" id="cal-grid"></div>
      </div>

      <div class="tb-div"></div>
      <div class="tb-slides">
        <div class="tbsl-label">Slides</div>
        <div class="tbsl-items" id="slide-items"></div>
      </div>
    </div>

    <div id="clock-display">
      <div id="clock-time">--:--</div>
      <div id="clock-date">Loading…</div>
    </div>
    <a class="btn-display-top" href="..admin/login.html" target="_blank">
    <button id="admin-login-btn" onclick="openAdminLogin()">🔐 Admin</button>  
    </a>
  </div>

  <div id="slideshow"></div>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
</div>

<div id="counter"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  storageBucket:     "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};
const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);

// ── ADMIN LOGIN MODAL ──
window.openAdminLogin = function() {
  document.getElementById('login-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('lm-email').focus(), 80);
  document.getElementById('lm-error').textContent = '';
};
window.closeAdminLogin = function() {
  document.getElementById('login-backdrop').classList.remove('open');
  document.getElementById('lm-email').value = '';
  document.getElementById('lm-pass').value = '';
  document.getElementById('lm-error').textContent = '';
  document.getElementById('lm-submit').disabled = false;
  document.getElementById('lm-submit').textContent = 'Sign In →';
};
window.handleLBClick = function(e) {
  if (e.target.id === 'login-backdrop') closeAdminLogin();
};
window.doAdminLogin = async function() {
  const email = document.getElementById('lm-email').value.trim();
  const pass  = document.getElementById('lm-pass').value;
  const errEl = document.getElementById('lm-error');
  const btn   = document.getElementById('lm-submit');
  if (!email || !pass) { errEl.textContent = 'Please enter email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  errEl.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.open('admin.html', '_blank');
    closeAdminLogin();
  } catch(e) {
    const msgs = {
      'auth/user-not-found':     'No account found with that email.',
      'auth/wrong-password':     'Incorrect password.',
      'auth/invalid-email':      'Invalid email address.',
      'auth/too-many-requests':  'Too many attempts. Try again later.',
      'auth/invalid-credential': 'Invalid email or password.',
    };
    errEl.textContent = msgs[e.code] || 'Login failed. Please try again.';
    btn.disabled = false; btn.textContent = 'Sign In →';
  }
};

// ── CLOCK ──
function updateClock() {
  const now  = new Date();
  const h    = String(now.getHours()).padStart(2,'0');
  const m    = String(now.getMinutes()).padStart(2,'0');
  const s    = String(now.getSeconds()).padStart(2,'0');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock-time').textContent = `${h}:${m}:${s}`;
  document.getElementById('clock-date').textContent =
    `${days[now.getDay()]}, ${mons[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── CALENDAR ──
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
const today = new Date();

window.calNav = function(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
};

function renderCalendar() {
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const DAYS   = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  document.getElementById('cal-month-label').textContent =
    `${MONTHS[calMonth].slice(0,3)} ${calYear}`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'tbcal-dow'; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  for (let i = firstDay - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'tbcal-day other';
    el.textContent = prevMonthDays - i;
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'tbcal-day';
    const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
    if (isToday) el.classList.add('today');
    el.textContent = d;
    grid.appendChild(el);
  }

  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const el = document.createElement('div');
    el.className = 'tbcal-day other'; el.textContent = d;
    grid.appendChild(el);
  }
}
renderCalendar();

// ── WEATHER ──
const WX_CODES = {
  0:'Clear Sky',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Icy Fog',
  51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',
  71:'Light Snow',73:'Snow',75:'Heavy Snow',77:'Snow Grains',
  80:'Showers',81:'Heavy Showers',82:'Violent Showers',
  85:'Snow Showers',86:'Heavy Snow Showers',
  95:'Thunderstorm',96:'Thunderstorm w/ Hail',99:'Thunderstorm w/ Heavy Hail'
};
const WX_ICONS = {
  0:'☀️',1:'🌤',2:'⛅',3:'☁️',
  45:'🌫',48:'🌫',
  51:'🌦',53:'🌧',55:'🌧',
  61:'🌦',63:'🌧',65:'🌧',
  71:'🌨',73:'❄️',75:'❄️',77:'❄️',
  80:'🌦',81:'🌧',82:'⛈',
  85:'🌨',86:'❄️',
  95:'⛈',96:'⛈',99:'⛈'
};

async function loadWeather(lat, lon, locationName) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      + `&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,relative_humidity_2m`
      + `&temperature_unit=celsius&windspeed_unit=kmh&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    const code = c.weathercode;
    document.getElementById('tbwx-icon').textContent = WX_ICONS[code] || '🌡';
    document.getElementById('tbwx-temp').textContent = `${Math.round(c.temperature_2m)}°C`;
    document.getElementById('tbwx-desc').textContent = WX_CODES[code] || 'Unknown';
    document.getElementById('tbwx-loc').textContent  = `📍 ${locationName}`;
    document.getElementById('tbwx-details').innerHTML = `
      <div class="tbwx-chip"><span class="tbwx-chip-label">Feels</span><span class="tbwx-chip-val">${Math.round(c.apparent_temperature)}°</span></div>
      <div class="tbwx-chip"><span class="tbwx-chip-label">Humid</span><span class="tbwx-chip-val">${c.relative_humidity_2m}%</span></div>
      <div class="tbwx-chip"><span class="tbwx-chip-label">Wind</span><span class="tbwx-chip-val">${Math.round(c.windspeed_10m)}km/h</span></div>
    `;
  } catch(e) {
    document.getElementById('tbwx-desc').textContent = 'Unavailable';
  }
}

function initWeather() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => loadWeather(pos.coords.latitude, pos.coords.longitude,
        `${pos.coords.latitude.toFixed(2)}°N, ${pos.coords.longitude.toFixed(2)}°E`),
      () => loadWeather(10.3157, 123.8854, 'Cebu City, PH'),
      { timeout: 6000 }
    );
  } else {
    loadWeather(10.3157, 123.8854, 'Cebu City, PH');
  }
}
initWeather();
setInterval(initWeather, 10 * 60 * 1000);

// ── SLIDESHOW ──
let slides = [], cur = 0, slideTimer = null, started = false;

function safe(s) {
  const d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

onValue(ref(db,'posts'), snap => {
  const prevCount = slides.length;
  slides = [];
  if (snap.exists()) snap.forEach(c => slides.push(c.val()));
  document.getElementById('loader').classList.add('hidden');
  buildSlideDOM();
  renderSlideList();
  if (!started) {
    started = true;
    goToSlide(0);
  } else {
    // Re-activate the current slide after DOM rebuild
    const el = document.getElementById('sl-' + cur);
    if (el) el.classList.add('active');
    else goToSlide(0);
  }
});

function buildSlideDOM() {
  const container = document.getElementById('slideshow');
  container.innerHTML = '';

  if (!slides.length) {
    container.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100%;align-items:center;
        justify-content:center;gap:12px;color:rgba(255,255,255,0.3);">
        <div style="font-size:48px">📭</div>
        <div style="font-size:16px">No posts yet. Add some from the Admin Panel.</div>
      </div>`;
    return;
  }

  slides.forEach((item, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.id = 'sl-' + i;

    if (item.type === 'text') {
      slide.innerHTML = `
        <div class="slide-text">
          ${item.category ? `<div class="cat-pill">${safe(item.category)}</div>` : ''}
          <div class="slide-title">${safe(item.title)}</div>
          ${item.content ? `<div class="slide-body">${safe(item.content)}</div>` : ''}
        </div>`;

    } else if (item.type === 'image') {
      const fsClass = item.fullscreen ? 'fs' : '';
      const imgSrc = safe(item.imageUrl || item.url);
      slide.innerHTML = `
        <div class="img-wrap ${fsClass}">
          <div class="img-blur-bg" style="background-image:url('${imgSrc}')"></div>
          <img src="${imgSrc}" alt="${safe(item.title)}"
               onerror="this.style.display='none'">
          ${item.category ? `<div class="img-cat">${safe(item.category)}</div>` : ''}
          ${item.title    ? `<div class="img-caption">${safe(item.title)}</div>` : ''}
        </div>`;

    } else if (item.type === 'video') {
      const cls = item.fullscreen ? 'fs' : 'windowed';
      slide.innerHTML = `
        <div class="vid-wrap ${cls}">
          <video autoplay muted playsinline preload="auto">
            <source src="${safe(item.url)}" type="video/mp4">
          </video>
        </div>`;
    }

    container.appendChild(slide);
  });
}

function renderSlideList() {
  const list = document.getElementById('slide-items');
  list.innerHTML = '';
  slides.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'tbsl-item' + (i === cur ? ' current' : '');
    el.id = 'sli-' + i;
    el.onclick = () => { clearTimeout(slideTimer); goToSlide(i); };
    el.innerHTML = `
      <span class="tbsl-dot"></span>
      <span class="tbsl-text">${safe(item.title || item.type || 'Slide')}</span>
    `;
    list.appendChild(el);
  });
}

function updateSlideListHighlight() {
  document.querySelectorAll('.tbsl-item').forEach((el, i) => {
    el.classList.toggle('current', i === cur);
  });
  const active = document.getElementById('sli-' + cur);
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function goToSlide(idx) {
  if (!slides.length) return;
  cur = ((idx % slides.length) + slides.length) % slides.length;

  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('sl-' + cur);
  if (!el) return;
  el.classList.add('active');

  const vid = el.querySelector('video');
  if (vid) { vid.currentTime = 0; vid.play().catch(() => {}); }

  document.getElementById('counter').textContent = `${cur + 1} / ${slides.length}`;

  const dur = Number(slides[cur]?.duration) || 5000;
  const bar = document.getElementById('prog-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${dur}ms linear`;
    bar.style.width = '100%';
  }));

  updateSlideListHighlight();
  clearTimeout(slideTimer);
  slideTimer = setTimeout(() => goToSlide(cur + 1), dur);
}
</script>
