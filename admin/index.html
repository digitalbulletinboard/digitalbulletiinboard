<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Bulletin Board</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#eef2ff; --surface:#fff; --s2:#f7f9ff;
      --primary:#5b7fff; --pl:#dce5ff; --pd:#3a5ce4;
      --text:#1e2a4a; --muted:#7a87a8; --border:#e2e8f8;
      --ok:#22c55e; --ok-bg:#dcfce7;
      --err:#ef4444; --err-bg:#fee2e2;
      --warn:#f59e0b; --warn-bg:#fef3c7;
      --r:12px;
    }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── NAVBAR ── */
    .nav {
      position:sticky; top:0; z-index:100;
      background:var(--surface); border-bottom:1px solid var(--border);
      height:62px; display:flex; align-items:center; justify-content:space-between;
      padding:0 30px; box-shadow:0 1px 12px rgba(91,127,255,.09);
    }
    .nav-brand { display:flex; align-items:center; gap:11px; }
    .nav-icon {
      font-size:20px; background:var(--pl);
      width:38px; height:38px; display:inline-flex;
      align-items:center; justify-content:center; border-radius:11px;
    }
    .nav-title { font-family:'Playfair Display',serif; font-size:18px; color:var(--text); }
    .nav-right { display:flex; align-items:center; gap:14px; }
    .nav-email { font-size:12px; color:var(--muted); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Bell */
    .bell-wrap { position:relative; }
    .bell-btn {
      background:var(--pl); border:none; border-radius:11px;
      width:40px; height:40px; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:.18s;
    }
    .bell-btn:hover { background:#c7d4ff; }
    .notif-badge {
      display:none; position:absolute; top:2px; right:2px;
      background:var(--err); color:#fff; border-radius:99px;
      font-size:9px; font-weight:800; min-width:16px; height:16px;
      align-items:center; justify-content:center; padding:0 4px; line-height:1;
    }

    .btn-logout {
      padding:8px 16px; background:transparent; color:var(--muted);
      border:1.5px solid var(--border); border-radius:9px;
      font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500;
      cursor:pointer; transition:.18s;
    }
    .btn-logout:hover { border-color:var(--err); color:var(--err); }

    /* ── NOTIFICATION DRAWER ── */
    .notif-drawer {
      position:fixed; top:62px; right:-380px; width:360px;
      height:calc(100vh - 62px); background:var(--surface);
      border-left:1px solid var(--border);
      box-shadow:-8px 0 32px rgba(0,0,0,.08);
      z-index:300; overflow-y:auto; transition:right .28s ease;
    }
    .notif-drawer.open { right:0; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.20); z-index:200; }
    .overlay.open { display:block; }
    .drawer-head {
      position:sticky; top:0; background:var(--surface);
      padding:20px 20px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .drawer-head h3 { font-size:15px; font-weight:700; display:flex; align-items:center; gap:7px; }
    .close-drawer {
      background:none; border:none; font-size:17px; color:var(--muted);
      cursor:pointer; width:30px; height:30px; border-radius:7px;
      display:flex; align-items:center; justify-content:center; transition:.18s;
    }
    .close-drawer:hover { background:var(--bg); color:var(--text); }

    .req-card { padding:16px 20px; border-bottom:1px solid var(--border); animation:fi .25s ease; }
    .req-name  { font-weight:700; font-size:14px; color:var(--text); margin-bottom:2px; }
    .req-email { font-size:12px; color:var(--muted); margin-bottom:8px; }
    .req-reason {
      font-size:12px; color:var(--text);
      background:var(--s2); padding:8px 12px; border-radius:9px;
      border-left:3px solid var(--primary); margin-bottom:12px; line-height:1.5;
    }
    .req-actions { display:flex; gap:8px; }
    .btn-approve {
      flex:1; padding:8px; background:var(--ok-bg); color:var(--ok);
      border:1.5px solid #86efac; border-radius:8px;
      font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700;
      cursor:pointer; transition:.18s;
    }
    .btn-approve:hover { background:var(--ok); color:#fff; border-color:var(--ok); }
    .btn-reject {
      flex:1; padding:8px; background:var(--err-bg); color:var(--err);
      border:1.5px solid #fca5a5; border-radius:8px;
      font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700;
      cursor:pointer; transition:.18s;
    }
    .btn-reject:hover { background:var(--err); color:#fff; border-color:var(--err); }
    .empty-drawer { text-align:center; padding:48px 20px; color:var(--muted); font-size:14px; }

    /* ── MAIN LAYOUT ── */
    .layout {
      display:grid; grid-template-columns:420px 1fr;
      gap:24px; padding:26px 30px;
      max-width:1240px; margin:0 auto;
    }
    @media(max-width:900px){ .layout{grid-template-columns:1fr;} }

    /* ── FORM CARD ── */
    .form-card {
      background:var(--surface); border-radius:20px; padding:26px;
      border:1px solid var(--border); box-shadow:0 2px 18px rgba(91,127,255,.08);
      height:fit-content; position:sticky; top:78px;
    }
    .card-title {
      font-family:'Playfair Display',serif; font-size:19px;
      margin-bottom:20px; display:flex; align-items:center; gap:9px;
    }
    .chip {
      font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700;
      padding:3px 11px; border-radius:99px;
      background:var(--pl); color:var(--primary);
    }
    .chip.edit { background:var(--warn-bg); color:var(--warn); }

    .fg { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .full { grid-column:1/-1; }
    .field label {
      display:block; font-size:10px; font-weight:700;
      color:var(--muted); text-transform:uppercase;
      letter-spacing:.07em; margin-bottom:6px;
    }
    .field input, .field textarea, .field select {
      width:100%; padding:10px 12px;
      border:1.5px solid var(--border); border-radius:var(--r);
      font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text);
      background:var(--s2); outline:none; transition:.18s; appearance:none;
    }
    .field textarea { min-height:82px; resize:vertical; }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(91,127,255,.11); background:#fff;
    }

    /* Upload */
    .upload-zone {
      border:2px dashed var(--border); border-radius:var(--r);
      padding:20px 14px; text-align:center; cursor:pointer;
      transition:.18s; background:var(--s2); position:relative; overflow:hidden;
    }
    .upload-zone:hover, .upload-zone.over { border-color:var(--primary); background:var(--pl); }
    .upload-zone input[type=file] {
      position:absolute; inset:0; opacity:0; cursor:pointer;
      width:100%; height:100%;
    }
    .upload-icon { font-size:30px; margin-bottom:7px; }
    .upload-hint { font-size:12px; color:var(--muted); line-height:1.5; }
    .preview-img {
      display:none; margin-top:10px;
      width:100%; max-height:130px; object-fit:cover;
      border-radius:9px; border:1.5px solid var(--border);
    }
    .prog-wrap { display:none; margin-top:9px; height:5px; background:var(--border); border-radius:99px; overflow:hidden; }
    .prog-bar  { height:100%; background:var(--primary); border-radius:99px; width:0%; transition:width .2s; }
    .upload-status { font-size:11px; color:var(--primary); margin-top:5px; display:none; text-align:center; }

    /* Checkbox */
    .cb-row { display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; font-size:13px; color:var(--text); }
    .cb-row input[type=checkbox] { display:none; }
    .cb-box {
      width:20px; height:20px; border:2px solid var(--border); border-radius:6px;
      background:var(--s2); display:flex; align-items:center; justify-content:center;
      transition:.18s; flex-shrink:0;
    }
    .cb-row input:checked ~ .cb-box { background:var(--primary); border-color:var(--primary); }
    .cb-row input:checked ~ .cb-box::after { content:'✓'; color:#fff; font-size:12px; font-weight:700; }

    .form-btns { display:flex; gap:10px; margin-top:20px; }
    .btn-save {
      flex:1; padding:12px; background:var(--primary); color:#fff; border:none;
      border-radius:var(--r); font-family:'DM Sans',sans-serif;
      font-size:14px; font-weight:700; cursor:pointer; transition:.18s;
    }
    .btn-save:hover { background:var(--pd); }
    .btn-save:active { transform:scale(.98); }
    .btn-save:disabled { opacity:.6; cursor:not-allowed; }
    .btn-clear {
      padding:12px 18px; background:transparent; color:var(--muted);
      border:1.5px solid var(--border); border-radius:var(--r);
      font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500;
      cursor:pointer; transition:.18s;
    }
    .btn-clear:hover { border-color:var(--primary); color:var(--primary); }

    /* ── POSTS PANEL ── */
    .posts-head {
      font-family:'Playfair Display',serif; font-size:19px;
      margin-bottom:18px; display:flex; align-items:center; gap:10px;
    }
    .post-cnt {
      font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700;
      padding:3px 12px; border-radius:99px; background:var(--pl); color:var(--primary);
    }
    .posts-list { display:flex; flex-direction:column; gap:13px; }
    .post-card {
      background:var(--surface); border-radius:16px; padding:17px 19px;
      border:1px solid var(--border); box-shadow:0 2px 12px rgba(91,127,255,.07);
      display:flex; gap:14px; align-items:flex-start; animation:fi .28s ease; transition:.18s;
    }
    .post-card:hover { box-shadow:0 5px 24px rgba(91,127,255,.14); transform:translateY(-1px); }
    .thumb {
      width:74px; height:58px; border-radius:9px; flex-shrink:0;
      border:1px solid var(--border); background:var(--s2);
      display:flex; align-items:center; justify-content:center;
      font-size:26px; overflow:hidden;
    }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .post-body { flex:1; min-width:0; }
    .post-tags { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
    .tag {
      font-size:10px; font-weight:700; padding:2px 10px;
      border-radius:99px; letter-spacing:.04em;
    }
    .tag.text  { background:var(--pl); color:var(--primary); }
    .tag.video { background:var(--warn-bg); color:var(--warn); }
    .tag.image { background:#f0fdf4; color:#16a34a; }
    .tag.cat   { background:var(--s2); color:var(--muted); }
    .post-title { font-size:14px; font-weight:700; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .post-meta  { font-size:11px; color:var(--muted); }
    .post-btns  { display:flex; gap:7px; flex-direction:column; flex-shrink:0; }
    .btn-edit {
      padding:7px 14px; background:var(--pl); color:var(--primary); border:none;
      border-radius:8px; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; cursor:pointer; transition:.18s;
    }
    .btn-edit:hover { background:var(--primary); color:#fff; }
    .btn-del {
      padding:7px 14px; background:var(--err-bg); color:var(--err); border:none;
      border-radius:8px; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; cursor:pointer; transition:.18s;
    }
    .btn-del:hover { background:var(--err); color:#fff; }
    .no-posts { text-align:center; padding:52px 20px; color:var(--muted); font-size:14px; }

    /* ── AUTH SPLASH ── */
    #auth-check {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:14px; z-index:999;
    }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @keyframes fi { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

<!-- AUTH CHECK SPLASH -->
<div id="auth-check">
  <div class="spinner"></div>
  <div style="font-size:14px;color:var(--muted)">Verifying access...</div>
</div>

<!-- PAGE (hidden until auth confirmed) -->
<div id="page" style="display:none">

<!-- NAVBAR -->
<nav class="nav">
  <div class="nav-brand">
    <span class="nav-icon">📋</span>
    <span class="nav-title">Bulletin Board Admin</span>
  </div>
  <div class="nav-right">
    <span class="nav-email" id="nav-email">—</span>
    <div class="bell-wrap">
      <button class="bell-btn" onclick="toggleDrawer()" title="Access Requests">🔔</button>
      <span class="notif-badge" id="notif-badge"></span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sign Out</button>
  </div>
</nav>

<!-- NOTIFICATION DRAWER -->
<div class="notif-drawer" id="notif-drawer">
  <div class="drawer-head">
    <h3>🔔 Access Requests</h3>
    <button class="close-drawer" onclick="toggleDrawer()">✕</button>
  </div>
  <div id="req-list"><p class="empty-drawer">No pending requests.</p></div>
</div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<!-- LAYOUT -->
<div class="layout">

  <!-- FORM -->
  <section class="form-card">
    <div class="card-title">
      <span id="form-title">New Post</span>
      <span class="chip" id="form-chip">Create</span>
    </div>

    <div class="fg">
      <div class="field full">
        <label>Title *</label>
        <input id="f-title" placeholder="Enter post title...">
      </div>
      <div class="field full">
        <label>Content / Description</label>
        <textarea id="f-content" placeholder="Write your announcement or description..."></textarea>
      </div>
     <!-- TOP BAR -->
<div id="topbar">
  <div class="tb-brand">
    <div class="tb-brand-icon">📋</div>
    Bulletin Board Admin
  </div>
  <div class="tb-right">
    <span class="tb-email" id="user-email"></span>
    <!-- DISPLAY BUTTON -->
    <a class="btn-display-top" href="/digitalbulletiinboard/display/index.html" target="_blank">
      📺 Open Display
    </a>
    <button class="btn-signout" id="signout-btn">Sign Out</button>
  </div>
</div>
      <div class="field">
        <label>Post Type</label>
        <select id="f-type" onchange="onTypeChange()">
          <option value="text">📝 Text Only</option>
          <option value="image">🖼️ Image</option>
          <option value="video">🎥 Video URL</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label>
        <input id="f-cat" placeholder="e.g. Announcement">
      </div>
      <div class="field">
        <label>Duration on screen (ms)</label>
        <input id="f-dur" type="number" placeholder="5000" min="1000" step="500">
      </div>

      <!-- IMAGE UPLOAD -->
      <div class="field full" id="grp-image" style="display:none">
        <label>Upload Image</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="img-input" accept="image/*" onchange="onFileSelect(event)">
          <div id="upload-placeholder">
            <div class="upload-icon">🖼️</div>
            <div class="upload-hint">Click or drag & drop<br><small>JPG, PNG, GIF, WebP — max 10 MB</small></div>
          </div>
          <img class="preview-img" id="preview-img" alt="preview">
        </div>
        <div class="prog-wrap" id="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
        <div class="upload-status" id="upload-status">⏳ Uploading...</div>
        <input type="hidden" id="f-imageUrl">
      </div>

      <!-- VIDEO URL -->
      <div class="field full" id="grp-video" style="display:none">
        <label>Video URL (.mp4)</label>
        <input id="f-videoUrl" placeholder="https://example.com/video.mp4">
      </div>

      <!-- FULLSCREEN CHECKBOX -->
      <div class="field full">
        <label class="cb-row">
          <input type="checkbox" id="f-fullscreen">
          <span class="cb-box"></span>
          Fullscreen (fills entire display)
        </label>
      </div>
    </div>

    <div class="form-btns">
      <button class="btn-clear" onclick="clearForm()">Clear</button>
      <button class="btn-save" id="btn-save" onclick="savePost()">
        <span id="save-label">💾 Save Post</span>
      </button>
    </div>
  </section>

  <!-- POSTS -->
  <section>
    <div class="posts-head">
      All Posts <span class="post-cnt" id="post-cnt">0</span>
    </div>
    <div class="posts-list" id="posts-list">
      <div class="no-posts">No posts yet — create one! 👈</div>
    </div>
  </section>

</div><!-- /layout -->
</div><!-- /page -->

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, remove, update, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
// ── CLOUDINARY CONFIG (free — no credit card needed) ─────────────────────────
// 1. Sign up free at https://cloudinary.com
// 2. Dashboard → Settings → Upload → Add upload preset → set "Signing Mode" to UNSIGNED
// 3. Paste your Cloud Name and Preset Name below
const CLOUDINARY_CLOUD  = "dmzmkkhao";   // e.g. "abc123xyz"
const CLOUDINARY_PRESET = "lckingcg"; // e.g. "bulletin_board_unsigned"
// ─────────────────────────────────────────────────────────────────────────────

// ── YOUR FIREBASE CONFIG ──────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
// ─────────────────────────────────────────────────────────────────────────────

const postsRef = ref(db, 'posts');
let editingId  = null;
let uploadedUrl = '';
let uploading   = false;

// ── AUTH GUARD ────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.replace('login.html'); return; }
  const snap = await get(ref(db, 'users/'+user.uid));
  if (!snap.exists() || snap.val().status !== 'approved') {
    await signOut(auth); window.location.replace('login.html'); return;
  }
  document.getElementById('auth-check').style.display = 'none';
  document.getElementById('page').style.display = 'block';
  document.getElementById('nav-email').textContent = user.email;
  listenNotifications();
  listenPosts();
});

window.doLogout = async () => { await signOut(auth); window.location.replace('login.html'); };

// ── NOTIFICATION DRAWER ───────────────────────────────────────────────────────
function listenNotifications() {
  onValue(ref(db,'notifications'), snap => {
    const list  = document.getElementById('req-list');
    const badge = document.getElementById('notif-badge');
    list.innerHTML = '';
    let count = 0;
    if (snap.exists()) {
      snap.forEach(child => {
        const n = child.val(); const uid = child.key;
        if (n.notifStatus !== 'unread') return;
        count++;
        const card = document.createElement('div');
        card.className = 'req-card';
        card.innerHTML = `
          <div class="req-name">👤 ${esc(n.name)}</div>
          <div class="req-email">${esc(n.email)}</div>
          <div class="req-reason">"${esc(n.reason)}"</div>
          <div class="req-actions">
            <button class="btn-approve" onclick="approveUser('${uid}')">✅ Approve</button>
            <button class="btn-reject"  onclick="rejectUser('${uid}')">❌ Reject</button>
          </div>`;
        list.appendChild(card);
      });
    }
    if (count === 0) { list.innerHTML='<p class="empty-drawer">No pending requests.</p>'; badge.style.display='none'; }
    else { badge.textContent=count; badge.style.display='flex'; }
  });
}

window.approveUser = async uid => {
  await update(ref(db,'users/'+uid),         { status:'approved' });
  await update(ref(db,'notifications/'+uid), { notifStatus:'read' });
};
window.rejectUser = async uid => {
  await update(ref(db,'users/'+uid),         { status:'rejected' });
  await update(ref(db,'notifications/'+uid), { notifStatus:'read' });
};
window.toggleDrawer = () => {
  document.getElementById('notif-drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
};

// ── TYPE TOGGLE ───────────────────────────────────────────────────────────────
window.onTypeChange = () => {
  const t = document.getElementById('f-type').value;
  document.getElementById('grp-image').style.display = t==='image' ? 'block' : 'none';
  document.getElementById('grp-video').style.display = t==='video' ? 'block' : 'none';
};

// ── IMAGE UPLOAD ──────────────────────────────────────────────────────────────
window.onFileSelect = e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10*1024*1024) { alert('File too large. Max 10 MB.'); return; }

  // Instant preview
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('preview-img');
    img.src = ev.target.result; img.style.display='block';
    document.getElementById('upload-placeholder').style.display='none';
  };
  reader.readAsDataURL(file);

  // ── Upload to Cloudinary (FREE — 25 GB storage, no credit card) ─────────────
  if (CLOUDINARY_CLOUD === 'YOUR_CLOUD_NAME') {
    alert('Please set your Cloudinary Cloud Name and Upload Preset in admin.html.\nSee README for instructions.');
    uploading = false; return;
  }
  const progWrap = document.getElementById('prog-wrap');
  const bar      = document.getElementById('prog-bar');
  const status   = document.getElementById('upload-status');
  progWrap.style.display = 'block';
  status.style.display   = 'block';
  status.textContent     = '⏳ Uploading...';
  uploadedUrl = ''; uploading = true;

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', 'bulletin-board');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`);

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) bar.style.width = Math.round(e.loaded/e.total*100)+'%';
  };
  xhr.onload = () => {
    if (xhr.status === 200) {
      const res = JSON.parse(xhr.responseText);
      uploadedUrl = res.secure_url;
      document.getElementById('f-imageUrl').value = uploadedUrl;
      progWrap.style.display = 'none';
      status.textContent = '✅ Image uploaded!';
      uploading = false;
    } else {
      console.error('Cloudinary error:', xhr.responseText);
      status.textContent = '❌ Upload failed. Check your Cloud Name & Preset.';
      uploading = false;
    }
  };
  xhr.onerror = () => { status.textContent='❌ Network error. Try again.'; uploading=false; };
  xhr.send(formData);
};

// Drag-and-drop
const zone = document.getElementById('upload-zone');
if (zone) {
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    const file = e.dataTransfer.files[0];
    if (file) { document.getElementById('img-input').files=e.dataTransfer.files; onFileSelect({target:{files:[file]}}); }
  });
}

// ── SAVE / UPDATE ─────────────────────────────────────────────────────────────
window.savePost = async () => {
  if (uploading) { alert('Image is still uploading. Please wait.'); return; }
  const title    = document.getElementById('f-title').value.trim();
  const content  = document.getElementById('f-content').value.trim();
  const type     = document.getElementById('f-type').value;
  const cat      = document.getElementById('f-cat').value.trim();
  const dur      = Number(document.getElementById('f-dur').value) || 5000;
  const full     = document.getElementById('f-fullscreen').checked;
  const videoUrl = document.getElementById('f-videoUrl').value.trim();
  const imageUrl = document.getElementById('f-imageUrl').value.trim() || uploadedUrl;

  if (!title) { alert('Please enter a title.'); document.getElementById('f-title').focus(); return; }
  if (type==='image' && !imageUrl) { alert('Please upload an image first.'); return; }
  if (type==='video' && !videoUrl) { alert('Please enter a video URL.'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled=true;
  document.getElementById('save-label').textContent = editingId ? '⏳ Updating...' : '⏳ Saving...';

  const data = {
    title, content, type,
    category: cat,
    duration: dur,
    fullscreen: full,
    url:      type==='video' ? videoUrl : (type==='image' ? imageUrl : ''),
    imageUrl: type==='image' ? imageUrl : '',
    updatedAt: Date.now()
  };

  try {
    if (editingId) {
      await update(ref(db,'posts/'+editingId), data);
    } else {
      data.createdAt = Date.now();
      await push(postsRef, data);
    }
    clearForm();
  } catch(e) {
    alert('Error saving post: '+e.message);
  }
  btn.disabled=false;
};

// ── LISTEN POSTS ──────────────────────────────────────────────────────────────
function listenPosts() {
  onValue(postsRef, snap => {
    const list = document.getElementById('posts-list');
    list.innerHTML = '';
    let cnt = 0;
    if (!snap.exists()) {
      list.innerHTML='<div class="no-posts">No posts yet — create one! 👈</div>';
      document.getElementById('post-cnt').textContent=0; return;
    }
    snap.forEach(child => {
      const d=child.val(); const key=child.key; cnt++;
      const typeTag = d.type==='image'?'🖼️ Image': d.type==='video'?'🎥 Video':'📝 Text';
      const thumbHtml = (d.type==='image'&&d.imageUrl)
        ? `<div class="thumb"><img src="${esc(d.imageUrl)}" alt=""></div>`
        : `<div class="thumb">${d.type==='video'?'🎥':d.type==='image'?'🖼️':'📝'}</div>`;
      const card = document.createElement('div');
      card.className='post-card';
      // Safely encode data for onclick
      const dataStr = encodeURIComponent(JSON.stringify(d));
      const keyStr  = encodeURIComponent(key);
      card.innerHTML=`
        ${thumbHtml}
        <div class="post-body">
          <div class="post-tags">
            <span class="tag ${d.type}">${typeTag}</span>
            ${d.category?`<span class="tag cat">${esc(d.category)}</span>`:''}
          </div>
          <div class="post-title">${esc(d.title)}</div>
          <div class="post-meta">${d.duration||5000}ms · ${d.fullscreen?'Fullscreen':'Windowed'}</div>
        </div>
        <div class="post-btns">
          <button class="btn-edit" data-key="${keyStr}" data-d="${dataStr}">✏️ Edit</button>
          <button class="btn-del"  data-key="${keyStr}">🗑️ Delete</button>
        </div>`;
      list.appendChild(card);
    });
    document.getElementById('post-cnt').textContent=cnt;
    // Attach events safely
    list.querySelectorAll('.btn-edit').forEach(btn=>{
      btn.onclick=()=>startEdit(decodeURIComponent(btn.dataset.key), JSON.parse(decodeURIComponent(btn.dataset.d)));
    });
    list.querySelectorAll('.btn-del').forEach(btn=>{
      btn.onclick=()=>delPost(decodeURIComponent(btn.dataset.key));
    });
  });
}

// ── EDIT ──────────────────────────────────────────────────────────────────────
function startEdit(key, d) {
  editingId = key;
  document.getElementById('f-title').value    = d.title    || '';
  document.getElementById('f-content').value  = d.content  || '';
  document.getElementById('f-type').value     = d.type     || 'text';
  document.getElementById('f-cat').value      = d.category || '';
  document.getElementById('f-dur').value      = d.duration || 5000;
  document.getElementById('f-fullscreen').checked = !!d.fullscreen;
  document.getElementById('f-videoUrl').value = d.url      || '';
  document.getElementById('f-imageUrl').value = d.imageUrl || '';
  uploadedUrl = d.imageUrl || '';

  if (d.type==='image' && d.imageUrl) {
    const img = document.getElementById('preview-img');
    img.src=d.imageUrl; img.style.display='block';
    document.getElementById('upload-placeholder').style.display='none';
    document.getElementById('upload-status').style.display='none';
  }
  onTypeChange();
  document.getElementById('form-title').textContent = 'Edit Post';
  document.getElementById('form-chip').textContent  = 'Editing';
  document.getElementById('form-chip').className    = 'chip edit';
  document.getElementById('save-label').textContent = '✅ Update Post';
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function delPost(key) {
  if (confirm('Delete this post?')) remove(ref(db,'posts/'+key));
}

// ── CLEAR ─────────────────────────────────────────────────────────────────────
window.clearForm = () => {
  ['f-title','f-content','f-cat','f-dur','f-videoUrl','f-imageUrl'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-type').value='text';
  document.getElementById('f-fullscreen').checked=false;
  document.getElementById('grp-image').style.display='none';
  document.getElementById('grp-video').style.display='none';
  const img=document.getElementById('preview-img');
  img.src=''; img.style.display='none';
  document.getElementById('upload-placeholder').style.display='block';
  document.getElementById('prog-wrap').style.display='none';
  document.getElementById('upload-status').style.display='none';
  uploadedUrl=''; uploading=false; editingId=null;
  document.getElementById('form-title').textContent='New Post';
  document.getElementById('form-chip').textContent='Create';
  document.getElementById('form-chip').className='chip';
  document.getElementById('save-label').textContent='💾 Save Post';
  document.getElementById('btn-save').disabled=false;
};

// XSS-safe escape
function esc(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
</script>
