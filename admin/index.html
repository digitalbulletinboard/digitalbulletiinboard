<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; font-family: 'Outfit', sans-serif; background: #f0f2f8; color: #0f172a; }

    /* ── TOPBAR ── */
    #topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center;
      padding: 0 28px; height: 62px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .tb-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 700; color: #0f172a;
    }
    .tb-brand-icon {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .tb-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 12px;
    }
    .tb-email {
      font-size: 13px; color: #64748b;
    }

    /* Display button in topbar */
    .btn-display-top {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 18px; border-radius: 9px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff; font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; text-decoration: none;
      transition: opacity 0.18s, transform 0.18s;
      box-shadow: 0 3px 12px rgba(99,102,241,0.35);
    }
    .btn-display-top:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn-display-top:active { transform: scale(0.97); }

    .btn-signout {
      padding: 8px 16px; border-radius: 9px;
      background: #fff; border: 1px solid #e2e8f0;
      color: #64748b; font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .btn-signout:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

    /* ── LAYOUT ── */
    #main {
      max-width: 1100px; margin: 0 auto;
      padding: 32px 28px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 28px;
      align-items: start;
    }

    /* ── CARD ── */
    .card {
      background: #fff; border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* ── FORM ── */
    .card-title {
      font-size: 17px; font-weight: 700; color: #0f172a;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .badge-create {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 10px; border-radius: 99px;
      background: #ede9fe; color: #6d28d9;
    }

    label.field-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: #64748b; margin-bottom: 6px; margin-top: 16px;
    }
    label.field-label:first-of-type { margin-top: 0; }
    label.required::after { content: ' *'; color: #ef4444; }

    input[type=text], input[type=number], input[type=url],
    textarea, select {
      width: 100%; padding: 10px 13px;
      border: 1px solid #e2e8f0; border-radius: 9px;
      font-family: 'Outfit', sans-serif; font-size: 14px;
      color: #0f172a; background: #f8fafc;
      outline: none; transition: border-color 0.18s, background 0.18s;
      resize: vertical;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #6366f1; background: #fff;
    }
    textarea { min-height: 90px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .checkbox-row {
      display: flex; align-items: center; gap: 9px;
      margin-top: 16px; cursor: pointer; user-select: none;
    }
    .checkbox-row input[type=checkbox] {
      width: 16px; height: 16px; cursor: pointer;
      accent-color: #6366f1;
    }
    .checkbox-label { font-size: 13px; color: #475569; font-weight: 500; }

    /* Image upload area */
    #drop-zone {
      margin-top: 10px;
      border: 2px dashed #cbd5e1; border-radius: 11px;
      padding: 22px; text-align: center;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
      background: #f8fafc;
    }
    #drop-zone:hover, #drop-zone.drag { border-color: #6366f1; background: #eef2ff; }
    #drop-zone .dz-icon { font-size: 28px; margin-bottom: 6px; }
    #drop-zone .dz-text { font-size: 13px; color: #64748b; }
    #drop-zone .dz-sub  { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    #file-input { display: none; }
    #preview-wrap { margin-top: 10px; display: none; }
    #preview-img  { max-width: 100%; border-radius: 8px; max-height: 140px; object-fit: contain; }
    #preview-name { font-size: 12px; color: #64748b; margin-top: 5px; }
    #upload-progress {
      margin-top: 8px; height: 5px;
      background: #e2e8f0; border-radius: 99px; overflow: hidden; display: none;
    }
    #upload-bar {
      height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6);
      width: 0%; transition: width 0.3s ease; border-radius: 99px;
    }

    /* Form actions */
    .form-actions {
      display: flex; gap: 10px; margin-top: 22px;
    }
    .btn-clear {
      padding: 11px 20px; border-radius: 10px;
      background: #fff; border: 1px solid #e2e8f0;
      color: #64748b; font-family: 'Outfit', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background 0.18s;
    }
    .btn-clear:hover { background: #f1f5f9; }
    .btn-save {
      flex: 1; padding: 11px 20px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; color: #fff;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.18s, transform 0.18s;
      box-shadow: 0 4px 16px rgba(99,102,241,0.4);
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-save:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── POSTS LIST ── */
    .posts-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .posts-title { font-size: 17px; font-weight: 700; color: #0f172a; }
    .posts-count {
      font-size: 12px; font-weight: 700; padding: 2px 10px;
      border-radius: 99px; background: #e0e7ff; color: #3730a3;
    }

    .post-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 12px;
      border: 1px solid #e2e8f0; background: #fafafa;
      margin-bottom: 10px; transition: box-shadow 0.18s;
    }
    .post-item:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.07); background: #fff; }

    .post-thumb {
      width: 64px; height: 48px; border-radius: 8px;
      object-fit: cover; background: #e2e8f0; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; overflow: hidden;
    }
    .post-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .post-info { flex: 1; min-width: 0; }
    .post-meta {
      display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
    }
    .post-type-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .type-text  { background: #dbeafe; color: #1e40af; }
    .type-image { background: #dcfce7; color: #166534; }
    .type-video { background: #fce7f3; color: #9d174d; }

    .post-cat  { font-size: 11px; color: #94a3b8; font-weight: 500; }
    .post-name { font-size: 14px; font-weight: 600; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-dur  { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    .post-actions { display: flex; gap: 7px; flex-shrink: 0; }
    .btn-edit {
      padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
      border: 1px solid #c7d2fe; background: #eef2ff; color: #4f46e5;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-edit:hover { background: #e0e7ff; }
    .btn-delete {
      padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
      border: 1px solid #fecaca; background: #fff1f2; color: #dc2626;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-delete:hover { background: #fee2e2; }

    .empty-state {
      text-align: center; padding: 48px 24px; color: #94a3b8;
    }
    .empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state .es-text { font-size: 14px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #0f172a; color: #fff; padding: 12px 24px; border-radius: 99px;
      font-size: 13px; font-weight: 500; z-index: 999;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0; pointer-events: none;
      display: flex; align-items: center; gap: 8px;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { background: #166534; }
    #toast.error   { background: #991b1b; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="tb-brand">
    <div class="tb-brand-icon">📋</div>
    Bulletin Board Admin
  </div>
  <div class="tb-right">
    <span class="tb-email" id="user-email"></span>
    <!-- DISPLAY BUTTON -->
    <a class="btn-display-top" href="display/index.html" target="_blank">
      📺 Open Display
    </a>
    <button class="btn-signout" id="signout-btn">Sign Out</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="main">

  <!-- LEFT: New Post Form -->
  <div class="card">
    <div class="card-title">
      New Post <span class="badge-create" id="form-mode-badge">Create</span>
    </div>

    <label class="field-label required">Title</label>
    <input type="text" id="f-title" placeholder="Enter post title…">

    <label class="field-label">Content / Description</label>
    <textarea id="f-content" placeholder="Write your announcement or description…"></textarea>

    <div class="row-2">
      <div>
        <label class="field-label">Post Type</label>
        <select id="f-type" onchange="onTypeChange()">
          <option value="text">📝 Text Only</option>
          <option value="image">🖼 Image</option>
          <option value="video">🎬 Video</option>
        </select>
      </div>
      <div>
        <label class="field-label">Category</label>
        <input type="text" id="f-cat" placeholder="e.g. Announcement">
      </div>
    </div>

    <label class="field-label">Duration on Screen (ms)</label>
    <input type="number" id="f-dur" value="5000" min="500" step="500">

    <!-- Image upload (shown for image type) -->
    <div id="img-section" style="display:none;">
      <label class="field-label">Image</label>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="handleDrop(event)">
        <div class="dz-icon">🖼</div>
        <div class="dz-text">Click to upload or drag & drop</div>
        <div class="dz-sub">PNG, JPG, GIF up to 10MB</div>
      </div>
      <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
      <div id="upload-progress"><div id="upload-bar"></div></div>
      <div id="preview-wrap">
        <img id="preview-img" src="" alt="Preview">
        <div id="preview-name"></div>
      </div>
      <label class="field-label" style="margin-top:14px;">Or paste image URL</label>
      <input type="url" id="f-imgurl" placeholder="https://…" oninput="onUrlInput()">
    </div>

    <!-- Video URL (shown for video type) -->
    <div id="vid-section" style="display:none;">
      <label class="field-label">Video URL (MP4)</label>
      <input type="url" id="f-vidurl" placeholder="https://…/video.mp4">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="f-fs">
      <span class="checkbox-label">Fullscreen (fills entire display)</span>
    </label>

    <div class="form-actions">
      <button class="btn-clear" onclick="clearForm()">Clear</button>
      <button class="btn-save" id="save-btn" onclick="savePost()">
        💾 Save Post
      </button>
    </div>
  </div>

  <!-- RIGHT: All Posts -->
  <div class="card">
    <div class="posts-header">
      <span class="posts-title">All Posts</span>
      <span class="posts-count" id="posts-count">0</span>
    </div>
    <div id="posts-list">
      <div class="empty-state">
        <div class="es-icon">📭</div>
        <div class="es-text">No posts yet. Create one!</div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script type="module">
import { initializeApp }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
                                  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, remove, onValue, update }
                                  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as sref, uploadBytesResumable, getDownloadURL }
                                  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBOm8OKOhHd_PCf8FeRkkscffne81MAaFc",
  authDomain:        "digitalbulletinboard-54f06.firebaseapp.com",
  databaseURL:       "https://digitalbulletinboard-54f06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "digitalbulletinboard-54f06",
  storageBucket:     "digitalbulletinboard-54f06.firebasestorage.app",
  messagingSenderId: "987342604782",
  appId:             "1:987342604782:web:90f8a7e895e8f8a2b026ff"
};

const fbApp   = initializeApp(firebaseConfig);
const auth    = getAuth(fbApp);
const db      = getDatabase(fbApp);
const storage = getStorage(fbApp);

// ── Auth guard ──
onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('user-email').textContent = user.email;
});

document.getElementById('signout-btn').onclick = async () => {
  await signOut(auth);
  window.location.href = 'index.html';
};

// ── Posts listener ──
let allPosts = {};
onValue(ref(db,'posts'), snap => {
  allPosts = snap.exists() ? snap.val() : {};
  renderPosts();
});

function renderPosts() {
  const list = document.getElementById('posts-list');
  const keys = Object.keys(allPosts);
  document.getElementById('posts-count').textContent = keys.length;

  if (!keys.length) {
    list.innerHTML = `<div class="empty-state"><div class="es-icon">📭</div><div class="es-text">No posts yet. Create one!</div></div>`;
    return;
  }

  list.innerHTML = keys.map(k => {
    const p = allPosts[k];
    const typeClass = { text:'type-text', image:'type-image', video:'type-video' }[p.type] || 'type-text';
    const thumb = p.type === 'image' && (p.imageUrl || p.url)
      ? `<img src="${esc(p.imageUrl||p.url)}" onerror="this.style.display='none'">`
      : (p.type === 'video' ? '🎬' : '📝');

    return `<div class="post-item">
      <div class="post-thumb">${typeof thumb === 'string' && thumb.startsWith('<') ? thumb : `<span>${thumb}</span>`}</div>
      <div class="post-info">
        <div class="post-meta">
          <span class="post-type-badge ${typeClass}">${p.type || 'text'}</span>
          ${p.category ? `<span class="post-cat">${esc(p.category)}</span>` : ''}
        </div>
        <div class="post-name">${esc(p.title || '(no title)')}</div>
        <div class="post-dur">${p.duration||5000}ms · ${p.fullscreen ? 'Fullscreen' : 'Windowed'}</div>
      </div>
      <div class="post-actions">
        <button class="btn-edit" onclick="editPost('${k}')">✏ Edit</button>
        <button class="btn-delete" onclick="deletePost('${k}')">🗑 Delete</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s||'');
  return d.innerHTML;
}

// ── Form helpers ──
window.onTypeChange = function() {
  const t = document.getElementById('f-type').value;
  document.getElementById('img-section').style.display = t === 'image' ? 'block' : 'none';
  document.getElementById('vid-section').style.display = t === 'video' ? 'block' : 'none';
};

window.clearForm = function() {
  editKey = null;
  document.getElementById('form-mode-badge').textContent = 'Create';
  document.getElementById('f-title').value = '';
  document.getElementById('f-content').value = '';
  document.getElementById('f-type').value = 'text';
  document.getElementById('f-cat').value = '';
  document.getElementById('f-dur').value = '5000';
  document.getElementById('f-fs').checked = false;
  document.getElementById('f-imgurl').value = '';
  document.getElementById('f-vidurl').value = '';
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-progress').style.display = 'none';
  uploadedUrl = null;
  onTypeChange();
};

let editKey = null;
window.editPost = function(k) {
  const p = allPosts[k];
  if (!p) return;
  editKey = k;
  document.getElementById('form-mode-badge').textContent = 'Edit';
  document.getElementById('f-title').value   = p.title || '';
  document.getElementById('f-content').value = p.content || '';
  document.getElementById('f-type').value    = p.type || 'text';
  document.getElementById('f-cat').value     = p.category || '';
  document.getElementById('f-dur').value     = p.duration || 5000;
  document.getElementById('f-fs').checked    = !!p.fullscreen;
  document.getElementById('f-imgurl').value  = p.imageUrl || p.url || '';
  document.getElementById('f-vidurl').value  = p.url || '';
  onTypeChange();
  if ((p.imageUrl || p.url) && p.type === 'image') {
    document.getElementById('preview-img').src = p.imageUrl || p.url;
    document.getElementById('preview-wrap').style.display = 'block';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deletePost = async function(k) {
  if (!confirm('Delete this post?')) return;
  await remove(ref(db, 'posts/' + k));
  showToast('Post deleted', 'success');
};

// ── File upload ──
let uploadedUrl = null;
window.handleFile = function(file) {
  if (!file) return;
  uploadedUrl = null;
  document.getElementById('preview-name').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('preview-wrap').style.display = 'block';
  };
  reader.readAsDataURL(file);

  const prog = document.getElementById('upload-progress');
  const bar  = document.getElementById('upload-bar');
  prog.style.display = 'block'; bar.style.width = '0%';

  const storageRef = sref(storage, `images/${Date.now()}_${file.name}`);
  const task = uploadBytesResumable(storageRef, file);
  task.on('state_changed',
    snap => { bar.style.width = (snap.bytesTransferred / snap.totalBytes * 100) + '%'; },
    err  => { showToast('Upload failed: ' + err.message, 'error'); prog.style.display = 'none'; },
    async () => {
      uploadedUrl = await getDownloadURL(task.snapshot.ref);
      document.getElementById('f-imgurl').value = uploadedUrl;
      prog.style.display = 'none';
      showToast('Image uploaded!', 'success');
    }
  );
};

window.handleDrop = function(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
};

window.onUrlInput = function() { uploadedUrl = null; };

// ── Save ──
window.savePost = async function() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Title is required', 'error'); return; }

  const type = document.getElementById('f-type').value;
  const imgUrl = uploadedUrl || document.getElementById('f-imgurl').value.trim();
  const vidUrl = document.getElementById('f-vidurl').value.trim();

  if (type === 'image' && !imgUrl) { showToast('Please upload or paste an image URL', 'error'); return; }
  if (type === 'video' && !vidUrl) { showToast('Please enter a video URL', 'error'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const data = {
    title,
    content:    document.getElementById('f-content').value.trim(),
    type,
    category:   document.getElementById('f-cat').value.trim(),
    duration:   Number(document.getElementById('f-dur').value) || 5000,
    fullscreen: document.getElementById('f-fs').checked,
  };
  if (type === 'image') data.imageUrl = imgUrl;
  if (type === 'video') data.url = vidUrl;

  try {
    if (editKey) {
      await update(ref(db, 'posts/' + editKey), data);
      showToast('Post updated!', 'success');
    } else {
      await push(ref(db, 'posts'), data);
      showToast('Post saved!', 'success');
    }
    clearForm();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '💾 Save Post';
};

// ── Toast ──
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => { t.className = ''; }, 3000);
}
</script>
</body>
</html>
